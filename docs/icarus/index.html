<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Icarus</title>
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Icarus">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{
  --bg:#faf9f5;--surface:#ffffff;--bubble:#f0eee6;--text:#141413;--muted:#6f6c64;--line:#e5e2d8;
  --accent:#2b2a27;--accent-text:#faf9f5;--ok:#2f7d4f;--bad:#b3412e;--warn:#9a6b12;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#262624;--surface:#30302e;--bubble:#141413;--text:#ecebe6;--muted:#a3a097;--line:#3d3d3a;
    --accent:#ecebe6;--accent-text:#1f1e1d;--ok:#6cc08f;--bad:#e5866f;--warn:#e0b45a}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  border-bottom:1px solid var(--line);background:var(--bg)}
header h1{font:600 17px/1.2 var(--sans);margin:0;flex:1}
header .sub{display:block;font:400 12px/1.3 var(--sans);color:var(--muted)}
.icon-btn{background:none;border:0;color:var(--text);width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:var(--bubble)}
.icon-btn svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 8px}
.wrap{max-width:720px;margin:0 auto}
.msg{margin:0 0 22px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .b{background:var(--bubble);border-radius:20px;padding:10px 15px;max-width:85%;
  font:16px/1.45 var(--sans);white-space:pre-wrap;word-wrap:break-word}
.msg.bot .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font:600 13px var(--sans);color:var(--muted)}
.msg.bot .who img{width:20px;height:20px;border-radius:6px}
.msg.bot .t{font:17px/1.55 var(--serif);white-space:pre-wrap;word-wrap:break-word}
.meta{font:12px/1.4 var(--sans);color:var(--muted);margin-top:4px}
.msg.user .meta{text-align:right}
.badge{display:inline-block;font:600 11px/1 var(--sans);padding:4px 7px;border-radius:999px;margin-right:6px;
  border:1px solid currentColor;letter-spacing:.02em}
.badge.pass{color:var(--ok)}.badge.fail{color:var(--bad)}.badge.wait{color:var(--warn)}
details{margin-top:8px;font:13px/1.45 var(--sans);color:var(--muted)}
details summary{cursor:pointer;padding:4px 0}
details pre{white-space:pre-wrap;word-wrap:break-word;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);
  max-height:50vh;overflow:auto}
.thinking{display:flex;align-items:center;gap:10px;font:15px var(--sans);color:var(--muted)}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;
  animation:b 1.2s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.empty{text-align:center;color:var(--muted);font:15px/1.5 var(--sans);margin-top:18vh}
.empty .big{font:28px/1.2 var(--serif);color:var(--text);margin-bottom:8px}
footer{padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg)}
.composer{max-width:720px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 1px 6px rgba(0,0,0,.05);padding:10px 10px 8px 14px}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--text);
  font:16px/1.4 var(--sans);max-height:40vh;min-height:24px;padding:2px 0}
.row{display:flex;align-items:center;gap:8px;margin-top:6px}
.chip{font:13px var(--sans);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px;
  background:none;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--text)}
.spacer{flex:1}
.send{width:36px;height:36px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-text);
  display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.35}
.send svg{width:18px;height:18px}
.err{max-width:720px;margin:0 auto 8px;font:13px/1.4 var(--sans);color:var(--bad)}
dialog{border:0;border-radius:18px;padding:0;width:min(92vw,460px);background:var(--surface);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.sheet{padding:20px}
.sheet h2{font:600 18px var(--sans);margin:0 0 6px}
.sheet p{font:14px/1.5 var(--sans);color:var(--muted);margin:0 0 12px}
.sheet input{width:100%;font:15px ui-monospace,Menlo,monospace;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--text)}
.sheet .btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.btn{font:600 15px var(--sans);padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.status{font:13px var(--sans);margin-top:10px;min-height:18px}
</style>
</head>
<body>
<header>
  <img src="./icon.svg" alt="" width="30" height="30" style="border-radius:8px">
  <h1>Icarus<span class="sub" id="sub">Teamchat #99</span></h1>
  <button class="icon-btn" id="refresh" aria-label="Refresh">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
  </button>
  <button class="icon-btn" id="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>
<main id="scroll"><div class="wrap" id="log"></div></main>
<footer>
  <div class="err" id="err" hidden></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message Icarus" autocomplete="off"></textarea>
    <div class="row">
      <button class="chip" id="ro" aria-pressed="false" title="Adds LOOP: off — Icarus can only read">Read-only</button>
      <span class="spacer"></span>
      <button class="send" id="send" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</footer>

<dialog id="dlg"><form class="sheet" method="dialog" id="form">
  <h2>Connect to GitHub</h2>
  <p>Paste your fine-grained GitHub token (Teamchat only: Issues read &amp; write, Contents read). It stays on this phone and is only sent to api.github.com.</p>
  <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
  <div class="status" id="tokstatus"></div>
  <div class="btns">
    <button class="btn" value="clear" id="clear" type="button">Remove token</button>
    <button class="btn" value="cancel" type="button" id="cancel">Close</button>
    <button class="btn primary" value="save" id="save" type="button">Save</button>
  </div>
</form></dialog>

<script>
"use strict";
const OWNER = "the1mburke-blip", REPO = "Teamchat", ISSUE = 99, OWNER_ID = 324897963;
const RECEIPT_BRANCH = "icarus-runs", API = "https://api.github.com";
const PREFIX = "ICARUS_RUN ";
const KEY = "icarus-chat-token";
const $ = id => document.getElementById(id);
const log = $("log"), scroller = $("scroll"), input = $("input"), sendBtn = $("send");
let token = "", busy = false, pending = new Map(), pollTimer = null;
const receiptCache = new Map();

function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }

async function gh(path, opts = {}) {
  const headers = { "Accept": opts.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28" };
  if (token) headers.Authorization = "Bearer " + token;
  if (opts.body) headers["Content-Type"] = "application/json";
  const r = await fetch(API + path, { method: opts.method || "GET", headers, cache: "no-store",
                                      body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok) {
    let msg = r.status + " " + r.statusText;
    try { const j = await r.json(); if (j.message) msg += ": " + j.message; } catch (e) {}
    const err = new Error(msg); err.status = r.status; throw err;
  }
  if (opts.raw) return r.text();
  if (opts.withLink) return { data: await r.json(), link: r.headers.get("link") || "" };
  return r.json();
}

function showErr(m) { const e = $("err"); e.textContent = m || ""; e.hidden = !m; }
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140; }
function toBottom() { scroller.scrollTop = scroller.scrollHeight; }

function stripPrefix(body) {
  let b = body.replace(/^\*\*/, "");
  if (b.startsWith("ICARUS_RUN")) b = b.slice("ICARUS_RUN".length);
  return b.replace(/^\*\*/, "").replace(/^\s+/, "");
}

// Receipt: "# Icarus run …", "- VERDICT: …", "## Model output (UNVERIFIED)", "## Error" …
function parseReceipt(text) {
  const sections = {}; let cur = "_head"; sections[cur] = [];
  for (const line of text.split("\n")) {
    const m = line.match(/^##\s+(.*)$/);
    if (m) { cur = m[1].trim(); sections[cur] = []; continue; }
    sections[cur].push(line);
  }
  const head = sections._head.join("\n");
  const vm = head.match(/^- VERDICT:\s*(.*)$/m);
  const verdict = vm ? vm[1].trim() : "";
  const outKey = Object.keys(sections).find(k => /^Model output/i.test(k));
  let answer = outKey ? sections[outKey].join("\n").trim() : "";
  const errKey = Object.keys(sections).find(k => /^Error/i.test(k));
  if (!answer && errKey) answer = sections[errKey].join("\n").trim();
  const ownerKey = Object.keys(sections).find(k => /^Owner needed/i.test(k));
  const owner = ownerKey ? ownerKey.replace(/^Owner needed:\s*/i, "").trim() : "";
  const modelM = head.match(/model:\s*([^\n]+)/);
  return { verdict, answer, owner, model: modelM ? modelM[1].trim() : "" };
}

function verdictBadge(v) {
  const b = el("span", "badge");
  if (/^PASS/i.test(v)) { b.classList.add("pass"); b.textContent = "PASS"; }
  else if (/^FAIL/i.test(v)) { b.classList.add("fail"); b.textContent = "FAIL"; }
  else { b.classList.add("wait"); b.textContent = (v.split(/\s|-/)[0] || "INFO").toUpperCase(); }
  return b;
}

function renderUser(c) {
  const m = el("div", "msg user"); m.dataset.cid = c.id;
  const box = el("div"); box.style.maxWidth = "85%";
  let text = stripPrefix(c.body); const ro = /^loop:\s*off\s*(\n|$)/i.test(text);
  if (ro) text = text.replace(/^loop:\s*off\s*\n?/i, "");
  const b = el("div", "b", text); b.style.maxWidth = "100%";
  box.append(b, el("div", "meta", (ro ? "Read-only · " : "") + fmtTime(c.created_at)));
  m.append(box); return m;
}

function renderBot(cid, receipt, path) {
  const m = el("div", "msg bot"); m.dataset.for = cid;
  const who = el("div", "who"); const img = el("img"); img.src = "./icon.svg"; img.alt = "";
  who.append(img, document.createTextNode("Icarus"));
  m.append(who);
  if (!receipt) {
    const t = el("div", "thinking"); const d = el("span", "dots"); d.append(el("span"), el("span"), el("span"));
    t.append(d, el("span", "", "Working…")); m.append(t);
    m.append(el("div", "meta", "Waiting for the run receipt. This usually takes a few minutes."));
    return m;
  }
  const p = parseReceipt(receipt);
  m.append(el("div", "t", p.answer || "(No answer text in the receipt.)"));
  const meta = el("div", "meta");
  if (p.verdict) { meta.append(verdictBadge(p.verdict), document.createTextNode(p.verdict.replace(/^\S+\s*-?\s*/, ""))); }
  if (p.owner && !/^false/i.test(p.owner)) { meta.append(document.createTextNode(" · Owner needed: " + p.owner)); }
  if (p.model) { meta.append(document.createTextNode((meta.childNodes.length ? " · " : "") + p.model)); }
  m.append(meta);
  const det = el("details"); det.append(el("summary", "", "Full receipt"), el("pre", "", receipt));
  if (path) { const a = el("a", "", "Open on GitHub"); a.href = `https://github.com/${OWNER}/${REPO}/blob/${RECEIPT_BRANCH}/${path}`;
    a.target = "_blank"; a.rel = "noopener"; a.style.color = "inherit"; det.append(a); }
  m.append(det);
  return m;
}

async function ownerCommands() {
  const first = await gh(`/repos/${OWNER}/${REPO}/issues/${ISSUE}/comments?per_page=100`, { withLink: true });
  let rows = first.data;
  const last = first.link.match(/[?&]page=(\d+)>; rel="last"/);
  if (last) {
    const n = +last[1];
    const pages = [n - 1, n].filter(p => p > 1);
    rows = [];
    for (const p of pages) rows = rows.concat(await gh(`/repos/${OWNER}/${REPO}/issues/${ISSUE}/comments?per_page=100&page=${p}`));
  }
  return rows.filter(c => c.user && c.user.id === OWNER_ID && /^(\*\*)?ICARUS_RUN(\s|\*\*|$)/.test(c.body || "")).slice(-25);
}

async function receiptIndex() {
  const commits = await gh(`/repos/${OWNER}/${REPO}/commits?sha=${RECEIPT_BRANCH}&path=icarus/runs&per_page=100`);
  const idx = new Map();
  for (const c of commits) {
    const m = (c.commit.message || "").match(/receipt for comment (\d+)/);
    if (m && !idx.has(m[1])) idx.set(m[1], c.sha);
  }
  return idx;
}

async function fetchReceipt(cid, sha) {
  if (receiptCache.has(cid)) return receiptCache.get(cid);
  const c = await gh(`/repos/${OWNER}/${REPO}/commits/${sha}`);
  const f = (c.files || []).find(f => f.filename.endsWith(`-${cid}.md`));
  if (!f) return null;
  const text = await gh(`/repos/${OWNER}/${REPO}/contents/${f.filename}?ref=${RECEIPT_BRANCH}`, { raw: true });
  const r = { text, path: f.filename }; receiptCache.set(cid, r); return r;
}

async function refresh(scroll) {
  if (!token) { renderEmpty(true); return; }
  const stick = scroll || nearBottom();
  try {
    showErr("");
    const [cmds, idx] = await Promise.all([ownerCommands(), receiptIndex()]);
    const frag = document.createDocumentFragment();
    if (!cmds.length) { renderEmpty(false); return; }
    for (const c of cmds) {
      frag.append(renderUser(c));
      const sha = idx.get(String(c.id));
      let r = null;
      if (sha) { try { r = await fetchReceipt(String(c.id), sha); } catch (e) { r = null; } }
      if (r) { pending.delete(String(c.id)); frag.append(renderBot(c.id, r.text, r.path)); }
      else {
        const ageMin = (Date.now() - Date.parse(c.created_at)) / 60000;
        if (ageMin < 60) { pending.set(String(c.id), true); frag.append(renderBot(c.id, null)); }
        else { const m = el("div", "msg bot"); m.append(el("div", "meta", "No receipt found for this message.")); frag.append(m); }
      }
    }
    log.replaceChildren(frag);
    $("sub").textContent = "Teamchat #99 · updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    if (stick) toBottom();
  } catch (e) {
    showErr(e.status === 401 ? "GitHub rejected the token. Open settings to replace it." : "Couldn't load: " + e.message);
  }
  schedulePoll();
}

function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(() => refresh(false), pending.size ? 15000 : 60000);
}

function renderEmpty(noToken) {
  log.replaceChildren();
  const d = el("div", "empty");
  d.append(el("div", "big", noToken ? "Connect to start" : "Talk to Icarus"),
           el("div", "", noToken ? "Tap the settings icon and paste your GitHub token." : "Your messages go to Teamchat #99. Replies appear here when his run finishes."));
  log.append(d);
}

async function send() {
  const text = input.value.trim();
  if (!text || busy || !token) return;
  busy = true; sendBtn.disabled = true; showErr("");
  // The owner-command workflow only fires on comments starting "ICARUS_RUN " (with the space).
  const rest = text.replace(/^ICARUS_RUN\s*/, "");
  const readOnly = $("ro").getAttribute("aria-pressed") === "true" && !/^\s*loop:\s*off\s*$/im.test(rest);
  const body = PREFIX + (readOnly ? "LOOP: off\n" : "") + rest;
  try {
    const c = await gh(`/repos/${OWNER}/${REPO}/issues/${ISSUE}/comments`, { method: "POST", body: { body } });
    input.value = ""; autosize();
    pending.set(String(c.id), true);
    log.querySelector(".empty")?.remove();
    log.append(renderUser(c), renderBot(c.id, null)); toBottom();
    schedulePoll();
  } catch (e) {
    showErr(e.status === 401 || e.status === 403 ? "GitHub refused to post (" + e.message + "). Check the token's Issues permission." : "Send failed: " + e.message);
  } finally { busy = false; sendBtn.disabled = !input.value.trim(); }
}

function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, window.innerHeight * 0.4) + "px"; sendBtn.disabled = !input.value.trim() || !token; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(pointer:fine)").matches) { e.preventDefault(); send(); } });
sendBtn.addEventListener("click", send);
$("ro").addEventListener("click", e => { const b = e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true"); });
$("refresh").addEventListener("click", () => refresh(true));

const dlg = $("dlg");
$("settings").addEventListener("click", () => { $("tok").value = ""; $("tokstatus").textContent = token ? "A token is saved on this phone." : ""; dlg.showModal(); });
$("cancel").addEventListener("click", () => dlg.close());
$("clear").addEventListener("click", () => { token = ""; store(KEY, null); $("tokstatus").textContent = "Token removed."; renderEmpty(true); autosize(); });
$("save").addEventListener("click", async () => {
  const t = $("tok").value.trim(); const st = $("tokstatus");
  if (!t) { st.textContent = "Paste a token first."; return; }
  st.textContent = "Checking…";
  const prev = token; token = t;
  try {
    const u = await gh("/user");
    if (u.id !== OWNER_ID) { token = prev; st.textContent = "That token belongs to " + u.login + ". Icarus only accepts the owner account."; return; }
    await gh(`/repos/${OWNER}/${REPO}/issues/${ISSUE}`);
    store(KEY, t); st.textContent = "Connected as " + u.login + ".";
    autosize(); setTimeout(() => { dlg.close(); refresh(true); }, 500);
  } catch (e) { token = prev; st.textContent = "Not accepted: " + e.message; }
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("./sw.js").catch(() => {}); }

token = load(KEY);
autosize();
refresh(true);
</script>
</body>
</html>
