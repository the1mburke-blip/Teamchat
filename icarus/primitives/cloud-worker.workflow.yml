# Icarus cloud executor (ICARUS-CLOUDIFY-20261118, route 1 of docs/ICARUS-CLOUDIFY-DESIGN-2026-11-18.md).
# Lives on the icarus-ledger branch: every ledger push from the pulse (a new queue file) starts one
# ephemeral runner that drains the queue, then exits. Pushes made by this job use GITHUB_TOKEN,
# which by GitHub design does not start another run, so it cannot loop.
# Cost: GitHub-hosted standard runners are free for public repositories.
# Kill switch: disable this workflow in the Actions tab, or delete this file from icarus-ledger.
name: icarus-ledger-worker
on:
  push:
    branches: [icarus-ledger]
    paths: ["icarus/ledger/queue/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: icarus-ledger-worker
  cancel-in-progress: false
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # hard stop, inside the 30-minute lease
    env:
      CODE_SHA: __CODE_SHA__     # pinned worker source (agent/icarus-cloud-worker)
    steps:
      - name: Worker source (pinned SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_SHA }}
          path: code
          persist-credentials: false
      - name: Ledger clone (icarus-ledger) + main for Icarus memory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git clone --quiet --depth 50 --branch icarus-ledger "https://github.com/${GITHUB_REPOSITORY}.git" ledger
          git -C ledger fetch --quiet --depth 1 origin main
      - name: Sandbox image
        run: docker pull --quiet python:3.12-slim
      - name: Drain queue (one job per cycle, max 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/code
          ICARUS_LEDGER_CLONE: ${{ github.workspace }}/ledger
          ICARUS_LEDGER_BRANCH: icarus-ledger
          ICARUS_WORK_DIR: ${{ runner.temp }}/icarus-work
          ICARUS_RUNNER_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          ICARUS_HOST: cloud
          ICARUS_SANDBOX: docker
          ICARUS_LEASE_SECONDS: "1800"
          ICARUS_MAX_POOL_BREAKS: "2"
        run: python3 -m icarus.primitives.daemon --drain 5
