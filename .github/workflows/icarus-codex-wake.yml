name: ICARUS Codex wake relay

on:
  workflow_dispatch:
    inputs:
      pulse_run_id:
        type: string
        required: true
      request_comment_id:
        type: string
        required: true

permissions: {}

concurrency:
  group: icarus-codex-wake-${{ inputs.pulse_run_id }}
  cancel-in-progress: false

jobs:
  wake:
    if: github.ref == 'refs/heads/main' && github.event.sender.id == 41898282
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      issues: read
      pull-requests: write
    steps:
      - name: Verify the active Pulse request and wake Codex
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { pulse_run_id, request_comment_id } = context.payload.inputs;
            const validId = value => /^[1-9][0-9]*$/.test(value) && Number.isSafeInteger(Number(value));
            if (!validId(pulse_run_id) || !validId(request_comment_id)) {
              throw new Error('Invalid Pulse relay identifiers');
            }
            const [{ data: pulse }, { data: request }] = await Promise.all([
              github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(pulse_run_id) }),
              github.rest.issues.getComment({ owner, repo, comment_id: Number(request_comment_id) }),
            ]);
            const created = Date.parse(request.created_at);
            const age = Date.now() - created;
            const expectedIssue = 'https://api.github.com/repos/' + owner + '/' + repo + '/issues/6';
            const expectedBody = '[ICARUS CODEX WAKE RELAY REQUEST]\nPulse Run ID: ' + pulse_run_id;
            if (pulse.path !== '.github/workflows/icarus-pulse.yml' || pulse.head_branch !== 'main' ||
                pulse.event !== 'schedule' || pulse.status !== 'in_progress' ||
                request.user?.id !== 41898282 || request.issue_url?.toLowerCase() !== expectedIssue.toLowerCase() ||
                request.body !== expectedBody || request.created_at !== request.updated_at ||
                !Number.isFinite(age) || age < 0 || age >= 180000 || created < Date.parse(pulse.run_started_at)) {
              throw new Error('Wake request is outside the authenticated operational Pulse window');
            }
            const body = '[ICARUS CODEX AVAILABILITY REQUEST]\nPulse Run ID: ' + pulse_run_id;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: 8, since: request.created_at, per_page: 100,
            });
            if (existing.some(row => row.user?.id === 41898282 && row.body === body)) return;
            const { data: comment } = await github.rest.issues.createComment({
              owner, repo, issue_number: 8, body,
            });
            core.info('Authenticated Codex wake request posted ' + comment.html_url);
