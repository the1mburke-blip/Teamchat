name: ICARUS single-file controller cut

on:
  push:
    branches: [experiment/icarus-hermes-surgery-20261008]
    paths: [.github/workflows/icarus-hermes-surgery-worker.yml]

permissions: {contents: read}
concurrency:
  group: icarus-hermes-single-file
  cancel-in-progress: false

jobs:
  cut:
    name: Local Qwen edits one pinned Hermes file
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: "12288"
      DO_NOT_TRACK: "1"
      PINNED_DONOR: 99a45ecc17cc51c0488ec3b8ccf7eaf483f7203d
    steps:
      - name: "Sparse checkout pinned donor: ONE source file and MIT license"
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 99a45ecc17cc51c0488ec3b8ccf7eaf483f7203d
          path: hermes-sparse
          sparse-checkout: |
            agent/turn_facade.py
            LICENSE
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Copy ONLY the editable source into isolated scratch Git repo
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/hermes-sparse"
          test -s "$SRC/agent/turn_facade.py"
          test -s "$SRC/LICENSE"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$PINNED_DONOR"
          mkdir -p /tmp/icarus-one-file/agent "$GITHUB_WORKSPACE/surgery-output"
          cp "$SRC/agent/turn_facade.py" /tmp/icarus-one-file/agent/turn_facade.py
          cp "$SRC/LICENSE" "$GITHUB_WORKSPACE/surgery-output/LICENSE"
          printf '%s\n' 'SOURCE_ONLY=agent/turn_facade.py' "DONOR_COMMIT=$PINNED_DONOR" 'MODEL=local qwen2.5-coder:1.5b via Aider' > "$GITHUB_WORKSPACE/surgery-output/metadata.txt"
          cd /tmp/icarus-one-file
          git init -q
          git config user.name 'icarus-onefile-worker'
          git config user.email 'actions@users.noreply.github.com'
          git add agent/turn_facade.py
          git commit -qm 'baseline pinned source'
          test "$(git ls-files | wc -l)" -eq 1

      - name: Prepare the same local free model without Aider
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh -o /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          nohup ollama serve >"$GITHUB_WORKSPACE/surgery-output/ollama.log" 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:1.5b

      - name: Single snippet from free local coding model - bounded output
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/icarus-one-file
          echo 'CODING_AGENT_ATTEMPTED=YES_DIRECT_OLLAMA_SMALL_INPUT' >> "$GITHUB_WORKSPACE/surgery-output/metadata.txt"
          cat > /tmp/icarus-small-edit.py <<'PY'
          import ast
          import json
          import os
          from pathlib import Path
          import textwrap
          from urllib.request import Request, urlopen

          out=Path(os.environ["GITHUB_WORKSPACE"])/"surgery-output"
          source_path=Path("/tmp/icarus-one-file/agent/turn_facade.py")
          original=source_path.read_text(encoding="utf-8")
          assert original.count("from agent.conversation_loop import run_conversation")==1
          call="                    result = run_conversation(\n                        self, user_message,"
          assert original.count(call)==1
          question=(
              "You are a Python coding worker doing one safe source edit. "
              "Generate ONLY a JSON object with a single key named guard, containing exactly "
              "a three-line Python source string to insert just before a function call. "
              "It must set controller = getattr(self, '_icarus_controller', None), "
              "then if controller is None OR its run_conversation method is not callable, "
              "raise RuntimeError('ICARUS controller unavailable'). "
              "Use normal Python indentation (0 spaces for first two lines, 4 for raise). "
              "Do not write any other code or commentary."
          )
          payload={
              "model":"qwen2.5-coder:1.5b",
              "prompt":question,
              "stream":False,
              "format":"json",
              "options":{"temperature":0,"num_ctx":2048,"num_predict":160}
          }
          req=Request(
              "http://127.0.0.1:11434/api/generate",
              data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"},
              method="POST"
          )
          with urlopen(req,timeout=280) as response:
              answer=json.loads(response.read().decode())
          raw=answer.get("response","")
          (out/"model-response.json").write_text(raw,encoding="utf-8")
          data=json.loads(raw)
          guard=data["guard"]
          assert isinstance(guard,str) and len(guard)<550
          code=ast.parse(guard)
          assert len(code.body)==2 and isinstance(code.body[0],ast.Assign)
          assert len(code.body[0].targets)==1 and isinstance(code.body[0].targets[0],ast.Name)
          assert code.body[0].targets[0].id=="controller"
          assert isinstance(code.body[0].value,ast.Call)
          assert isinstance(code.body[0].value.func,ast.Name) and code.body[0].value.func.id=="getattr"
          assert any(isinstance(n,ast.Constant) and n.value=="_icarus_controller" for n in ast.walk(code.body[0]))
          condition=code.body[1]
          assert isinstance(condition,ast.If) and not condition.orelse
          assert len(condition.body)==1 and isinstance(condition.body[0],ast.Raise)
          assert any(isinstance(n,ast.Name) and n.id=="callable" for n in ast.walk(condition.test))
          assert any(isinstance(n,ast.Constant) and n.value=="run_conversation" for n in ast.walk(condition.test))
          assert any(isinstance(n,ast.Compare) and any(isinstance(op,ast.Is) for op in n.ops) for n in ast.walk(condition.test))
          err=condition.body[0].exc
          assert isinstance(err,ast.Call) and isinstance(err.func,ast.Name) and err.func.id=="RuntimeError"
          assert any(isinstance(n,ast.Constant) and n.value=="ICARUS controller unavailable" for n in ast.walk(err))
          normalized=textwrap.dedent(guard).strip()
          prefix="                    "
          insertion="".join(prefix+line+"\n" for line in normalized.splitlines())
          replacement=insertion+"                    result = controller.run_conversation(\n                        user_message,"
          updated=original.replace("        from agent.conversation_loop import run_conversation\n","")
          updated=updated.replace(call,replacement)
          assert updated!=original
          ast.parse(updated)
          source_path.write_text(updated,encoding="utf-8")
          (out/"metadata.txt").open("a").write("MODEL_EDIT_GENERATED=YES\nMODEL_OUTPUT_VALIDATED=YES\n")
          print("Model supplied fail-closed guard, applied to exactly one donor source file.")
          PY
          set +e
          timeout 310 python /tmp/icarus-small-edit.py >"$GITHUB_WORKSPACE/surgery-output/coder.log" 2>&1
          code=$?
          set -e
          echo "CODING_AGENT_EXIT=$code" >> "$GITHUB_WORKSPACE/surgery-output/metadata.txt"
          if test "$code" -ne 0; then
            cat "$GITHUB_WORKSPACE/surgery-output/coder.log"
            exit "$code"
          fi

      - name: Verify exactly one source changed and compiles
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/icarus-one-file
          OUT="$GITHUB_WORKSPACE/surgery-output"
          git status --short > "$OUT/status.txt"
          git diff --name-only > "$OUT/modified-files.txt"
          git diff --no-ext-diff -- agent/turn_facade.py > "$OUT/one-file.patch"
          cp agent/turn_facade.py "$OUT/turn_facade.py"
          sha256sum agent/turn_facade.py > "$OUT/source-sha256.txt"
          if test "$(cat "$OUT/modified-files.txt")" != 'agent/turn_facade.py'; then
            echo 'ONE_FILE_GATE=FAIL' | tee -a "$OUT/metadata.txt"
            exit 1
          fi
          python -m py_compile agent/turn_facade.py
          python - <<'PY'
          import ast
          source = open('agent/turn_facade.py', encoding='utf-8').read()
          f = next(n for n in ast.walk(ast.parse(source)) if isinstance(n, ast.FunctionDef) and n.name == 'run_conversation')
          assert '_icarus_controller' in ast.get_source_segment(source, f), 'ICARUS_HOOK_MISSING'
          assert any(isinstance(n, ast.Raise) and isinstance(n.exc, ast.Call) and isinstance(n.exc.func, ast.Name) and n.exc.func.id == 'RuntimeError' for n in ast.walk(f)), 'EXPLICIT_RUNTIMEERROR_MISSING'
          assert any(isinstance(n, ast.Attribute) and n.attr == 'run_conversation' for n in ast.walk(f)), 'DELEGATION_MISSING'
          assert not any(isinstance(n, ast.ImportFrom) and n.module == 'agent.conversation_loop' for n in ast.walk(f)), 'HERMES_CONTROLLER_STILL_IMPORTED'
          print('STRUCTURE_CHECK=PASS; FULL_RUNTIME=UNVERIFIED')
          PY
          echo 'ONE_FILE_SOURCE_CUT=STRUCTURALLY_VERIFIED_ONLY' >> "$OUT/metadata.txt"

      - name: Upload one-file patch and exact logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ICARUS-one-file-controller-cut
          path: surgery-output/
          retention-days: 7
          if-no-files-found: warn
