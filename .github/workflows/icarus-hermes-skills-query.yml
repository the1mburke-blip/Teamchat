name: Icarus Hermes Skills Query (one-shot)

# One bounded OpenRouter free-model call (1 of ~20/day). No retries. Writes result to icarus/runs/.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: icarus-hermes-skills
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: One OpenRouter call
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p icarus/runs
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, datetime
          model = "nvidia/nemotron-3-super-120b-a12b:free"
          sysmsg = "You are a tightly scoped selector. Output only the requested list. Never invent skill or plugin names: if you are not certain a named Hermes Agent (Nous Research) skill or plugin exists, describe the capability generically and mark it [UNVERIFIED]. No preamble, no closing text."
          user = ("Icarus is an autonomous supervisor agent running inside a Hermes-Agent-based harness (DeepSeek reasoning model underneath). "
                  "His duties: supervise a GitHub repo and team tasks on an hourly schedule, keep persistent memory files, enforce per-task budgets/tool allowlists/hard stops/approval gates, "
                  "independently verify other agents' claims against tool logs, fail over between free model quotas (Google AI Studio then OpenRouter free, about 20 calls/day), "
                  "run Shopify actions via Composio, and report PASS/PARTIAL/BLOCKED with evidence. "
                  "List exactly 10 Hermes Agent skills or plugins he cannot do without. Format each line as: N. <skill/plugin name or generic capability> - <one sentence: why Icarus needs it> - [VERIFIED NAME] or [UNVERIFIED]. Exactly 10 lines.")
          body = json.dumps({"model": model, "temperature": 0.2, "max_tokens": 900,
                             "messages": [{"role": "system", "content": sysmsg}, {"role": "user", "content": user}]}).encode()
          req = urllib.request.Request("https://openrouter.ai/api/v1/chat/completions", data=body,
                headers={"Authorization": "Bearer " + os.environ.get("OPENROUTER_API_KEY", ""), "Content-Type": "application/json"})
          ts = datetime.datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")
          out = "# Hermes skills query (OpenRouter free, 1 call)\n\nmodel requested: " + model + "\nwhen: " + ts + "\n\n"
          try:
              r = urllib.request.urlopen(req, timeout=120)
              d = json.loads(r.read())
              m = (d.get("choices") or [{}])[0].get("message") or {}
              text = (m.get("content") or "").strip() or (m.get("reasoning") or "").strip()
              out += "status: HTTP 200\nmodel returned: " + str(d.get("model")) + "\nfinish_reason: " + str((d.get("choices") or [{}])[0].get("finish_reason")) + "\n\n" + text + "\n"
          except urllib.error.HTTPError as e:
              out += "status: HTTP " + str(e.code) + " (not retried)\n" + e.read().decode()[:300] + "\n"
          except Exception as e:
              out += "status: ERROR (not retried) " + str(e)[:300] + "\n"
          open("icarus/runs/" + ts + "-hermes-skills.md", "w").write(out)
          print(out[:200])
          PY
      - name: Save result
        if: always()
        run: |
          git config user.name "icarus-runtime"
          git config user.email "icarus-runtime@users.noreply.github.com"
          git add icarus/runs
          git diff --cached --quiet || git commit -m "chore(icarus): hermes skills query result"
          git pull --rebase --quiet origin main || true
          git push origin HEAD:main || echo "push failed"
