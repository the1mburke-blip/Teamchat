name: Teamchat Gemini CLI Proxy (paused - identity unverified)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: teamchat-prime-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  prime_ingress:
    # Paused: this workflow invokes a separate Gemini API model, not the owner's
    # interactive Prime session. Do not reactivate under TARGET: PRIME.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_CLI_TRUST_WORKSPACE: "true"

    steps:
      - name: Checkout canonical Teamchat
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run Gemini CLI proxy (paused)
        id: prime
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.8-flash
          prompt: |-
            You are a separate Gemini CLI API invocation. You are not Michael's interactive Prime session.

            This is a connection/ingress proof only. Do not mutate repository files, task ownership, production systems, or external services.

            Before answering:
            1. Read OPERATING_RULES.md.
            2. Read TRAINING_MATRIX.md.
            3. Read HANDOFF_PROTOCOL.md.
            4. Read the relevant tail of CHAT_LOG.md.
            5. Inspect this GitHub wake payload:

            ${{ github.event.comment.body }}

            Return exactly these four lines:
            [GEMINI_CLI_PROXY] API_INVOCATION_ONLY
            TRAINING_REVIEW: PASS
            SOURCE: GitHub issue_comment -> Gemini CLI
            WAKE_COMMENT_ID: ${{ github.event.comment.id }}

      - name: Write Prime response into PR #8
        if: ${{ steps.prime.outputs.summary != '' }}
        uses: actions/github-script@v7
        env:
          PRIME_OUTPUT: ${{ steps.prime.outputs.summary }}
        with:
          github-token: ${{ github.token }}
          script: |
            const output = String(process.env.PRIME_OUTPUT || '').trim();
            if (!output) {
              core.setFailed('Gemini Prime returned no summary.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 8,
              body: output
            });
