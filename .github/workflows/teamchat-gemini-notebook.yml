name: Teamchat Gemini Prime Notebook

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: teamchat-gemini-notebook-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  gemini_notebook:
    if: >-
      github.event.issue.number == 8 &&
      github.event.issue.pull_request != null &&
      (github.event.comment.user.login == 'github-actions[bot]' ||
       github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, 'TEAMCHAT_WAKE') ||
       startsWith(github.event.comment.body, '[TEAMCHAT_WAKE]')) &&
      contains(github.event.comment.body, 'TARGET: PRIME')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout canonical Teamchat
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve real Teamchat task context
        id: context
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const wake = String(context.payload.comment?.body || '');
            const wakeId = String(context.payload.comment?.id || '');

            const patterns = [
              /\bISSUE:\s*#?(\d+)\b/i,
              /\bNEW_TASK\s+#(\d+)\b/i,
              /\/issues\/(\d+)\b/i
            ];
            let targetIssue = 0;
            for (const re of patterns) {
              const m = wake.match(re);
              if (m) {
                targetIssue = Number(m[1]) || 0;
                break;
              }
            }

            const sections = [
              '# TEAMCHAT WAKE',
              'WAKE_COMMENT_ID: ' + wakeId,
              '',
              '## Wake payload',
              wake
            ];

            if (targetIssue && targetIssue !== 8) {
              const issue = (await github.rest.issues.get({
                owner, repo, issue_number: targetIssue
              })).data;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: targetIssue, per_page: 100
              });
              sections.push(
                '',
                '## Target issue',
                'NUMBER: ' + targetIssue,
                'TITLE: ' + String(issue.title || ''),
                'STATE: ' + String(issue.state || ''),
                '',
                '### Issue body',
                String(issue.body || ''),
                '',
                '### Recent comments',
                ...comments.slice(-20).map(c =>
                  '[' + String(c.user?.login || 'unknown') + ']\n' +
                  String(c.body || '').slice(0, 5000)
                )
              );
            }

            fs.writeFileSync('GEMINI_WAKE.md', sections.join('\n'), 'utf8');
            core.setOutput('target_issue', targetIssue ? String(targetIssue) : '');

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Jupyter executor
        run: python -m pip install -q nbconvert ipykernel

      - name: Execute official Gemini notebook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          test -n "$GEMINI_API_KEY" || { echo "GEMINI_API_KEY missing"; exit 1; }
          jupyter nbconvert \
            --to notebook \
            --execute GEMINI_PRIME.ipynb \
            --output GEMINI_PRIME.executed.ipynb \
            --ExecutePreprocessor.timeout=420
          test -s GEMINI_RESPONSE.md

      - name: Write notebook result back to Teamchat
        uses: actions/github-script@v7
        env:
          TARGET_ISSUE: ${{ steps.context.outputs.target_issue }}
          WAKE_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('GEMINI_RESPONSE.md', 'utf8').trim();
            const targetIssue = Number(process.env.TARGET_ISSUE || 0) || 0;
            const wakeId = String(process.env.WAKE_COMMENT_ID || '');
            if (!output) {
              core.setFailed('Notebook produced no Gemini response.');
              return;
            }

            const body = [
              '[PRIME_NOTEBOOK] TEAMCHAT_RESPONSE',
              'SOURCE_WAKE_COMMENT: ' + wakeId,
              '',
              output
            ].join('\n').slice(0, 60000);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 8,
              body
            });

            if (targetIssue && targetIssue !== 8) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: targetIssue,
                body
              });
            }
