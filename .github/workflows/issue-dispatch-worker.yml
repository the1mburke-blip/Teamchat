name: Icarus Issue Dispatch Worker

on:
  issues:
    types: [labeled]

jobs:
  dispatch:
    if: github.event.label.name == 'icarus-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: icarus-dispatch-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out the event commit
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the worker and publish its reviewed handoff
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/dispatch_worker.py --issue-number "$ISSUE_NUMBER"
