name: Prime Snapshot Sync

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'STATUS.md'
      - 'OPERATING_RULES.md'
      - 'HANDOFF_PROTOCOL.md'
      - 'CONTENT_PIPELINE.md'
      - 'CHAT_LOG.md'
      - 'TRAINING_MATRIX.md'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: prime-snapshot-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ vars.PRIME_SNAPSHOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authorize event
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json, os
          name = os.environ["EVENT_NAME"]
          event = json.load(open(os.environ["EVENT_PATH"], encoding="utf-8"))
          allowed = True
          if name == "issue_comment":
              allowed = str(event.get("comment", {}).get("author_association", "")).upper() in {"OWNER","MEMBER","COLLABORATOR"}
          elif name == "issues":
              allowed = str(event.get("issue", {}).get("author_association", "")).upper() in {"OWNER","MEMBER","COLLABORATOR"}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"allowed={'true' if allowed else 'false'}\n")
          print("AUTHORIZED_EVENT" if allowed else "IGNORED_UNAUTHORIZED_EVENT")
          PY

      - name: Checkout canonical Teamchat
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Authenticate Google service account
        if: steps.gate.outputs.allowed == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true

      - name: Setup Python
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google client
        if: steps.gate.outputs.allowed == 'true'
        run: python -m pip install -q google-api-python-client google-auth

      - name: Refresh fixed Prime snapshot
        if: steps.gate.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_DOC_ID: ${{ vars.PRIME_SNAPSHOT_DOC_ID }}
        run: python scripts/update_prime_snapshot.py
