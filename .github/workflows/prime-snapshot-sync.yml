name: Prime Snapshot Sync

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'STATUS.md'
      - 'OPERATING_RULES.md'
      - 'HANDOFF_PROTOCOL.md'
      - 'CONTENT_PIPELINE.md'
      - 'CHAT_LOG.md'
      - 'TRAINING_MATRIX.md'
      - 'BUFFER_QUEUE_STATE.md'
      - 'BLOG_QUEUE_STATE.md'
      - 'scripts/update_prime_snapshot.py'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: prime-snapshot-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ vars.PRIME_SNAPSHOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authorize event
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          name = os.environ["EVENT_NAME"]
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          allowed = True
          if name == "issue_comment":
              allowed = str(event.get("comment", {}).get("author_association", "")).upper() in {"OWNER","MEMBER","COLLABORATOR"}
          elif name == "issues":
              allowed = str(event.get("issue", {}).get("author_association", "")).upper() in {"OWNER","MEMBER","COLLABORATOR"}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"allowed={'true' if allowed else 'false'}\n")
          print("AUTHORIZED_EVENT" if allowed else "IGNORED_UNAUTHORIZED_EVENT")
          PY

      - name: Checkout canonical Teamchat
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Refresh Buffer queue state
        id: buffer_refresh
        if: steps.gate.outputs.allowed == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "BUFFER_API_KEY_MISSING — retaining last verified queue state"
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/update_buffer_queue.py
          echo "refreshed=true" >> "$GITHUB_OUTPUT"

      - name: Persist refreshed Buffer queue state
        if: steps.buffer_refresh.outputs.refreshed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const path = 'BUFFER_QUEUE_STATE.md';
            const content = fs.readFileSync(path, 'utf8');
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const existing = Buffer.from(current.data.content || '', 'base64').toString('utf8');
            if (existing === content) {
              core.notice('Buffer queue state unchanged; no commit needed.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'Refresh Buffer queue state',
              content: Buffer.from(content, 'utf8').toString('base64'),
              sha: current.data.sha,
              branch: 'main'
            });

      - name: Build compact Prime snapshot
        if: steps.gate.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_prime_snapshot.py

      - name: Update fixed Google Form response
        if: steps.gate.outputs.allowed == 'true'
        env:
          PRIME_SNAPSHOT_EDIT_URL: ${{ secrets.PRIME_SNAPSHOT_EDIT_URL }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          class FormParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.action = None
                  self.hidden = {}
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "form" and attrs.get("action") and self.action is None:
                      self.action = attrs["action"]
                  if tag == "input" and attrs.get("type") == "hidden" and attrs.get("name"):
                      self.hidden[attrs["name"]] = attrs.get("value", "")

          edit_url = os.environ["PRIME_SNAPSHOT_EDIT_URL"]
          if not edit_url.startswith("https://docs.google.com/forms/"):
              raise SystemExit("Invalid PRIME_SNAPSHOT_EDIT_URL")

          req = urllib.request.Request(edit_url, headers={"User-Agent":"HumanVibe-Prime-Snapshot/1.0"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              page = resp.read().decode("utf-8", errors="replace")

          parser = FormParser()
          parser.feed(page)
          if not parser.action:
              raise SystemExit("Google Form edit page did not expose a form action")

          payload = json.load(open("prime_snapshot_payload.json", encoding="utf-8"))
          data = dict(parser.hidden)
          data.update({
              "entry.1699301106": payload["run_id"],
              "entry.807518215": payload["marker"],
              "entry.465536805": payload["sequence"],
              "entry.1756592575": payload["total"],
              "entry.414143502": payload["snapshot"],
          })

          encoded = urllib.parse.urlencode(data).encode("utf-8")
          post = urllib.request.Request(
              parser.action,
              data=encoded,
              headers={
                  "Content-Type":"application/x-www-form-urlencoded",
                  "User-Agent":"HumanVibe-Prime-Snapshot/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(post, timeout=60) as resp:
              body = resp.read().decode("utf-8", errors="replace")
              status = resp.status

          if status != 200:
              raise SystemExit(f"Google Form update failed HTTP {status}")
          if "Your response has been recorded" not in body and "Edit your response" not in body:
              print("FORM_UPDATE_HTTP_200 confirmation-text-not-detected")
          print(f"FORM_UPDATE_OK marker={payload['marker']} chars={len(payload['snapshot'])}")
          PY
