name: Prime Snapshot Sync

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'STATUS.md'
      - 'OPERATING_RULES.md'
      - 'HANDOFF_PROTOCOL.md'
      - 'CONTENT_PIPELINE.md'
      - 'CHAT_LOG.md'
      - 'TRAINING_MATRIX.md'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: prime-snapshot-sync
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ vars.PRIME_SNAPSHOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authorize event
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json, os
          name = os.environ["EVENT_NAME"]
          event = json.load(open(os.environ["EVENT_PATH"], encoding="utf-8"))
          allowed = True
          if name == "issue_comment":
              allowed = str(event.get("comment", {}).get("author_association", "")).upper() in {"OWNER","MEMBER","COLLABORATOR"}
          elif name == "issues":
              allowed = str(event.get("issue", {}).get("author_association", "")).upper() in {"OWNER","MEMBER","COLLABORATOR"}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"allowed={'true' if allowed else 'false'}\n")
          print("AUTHORIZED_EVENT" if allowed else "IGNORED_UNAUTHORIZED_EVENT")
          PY

      - name: Checkout canonical Teamchat
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build snapshot payload
        if: steps.gate.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_WEBHOOK_SECRET: ${{ secrets.PRIME_SNAPSHOT_WEBHOOK_SECRET }}
        run: python scripts/update_prime_snapshot.py

      - name: Send snapshot to Apps Script
        if: steps.gate.outputs.allowed == 'true'
        env:
          SNAPSHOT_WEBAPP_URL: ${{ secrets.PRIME_SNAPSHOT_WEBAPP_URL }}
        run: |
          test -n "$SNAPSHOT_WEBAPP_URL"
          curl -L --silent --show-error --fail-with-body \
            -H 'Content-Type: application/json' \
            --data-binary @prime_snapshot_payload.json \
            "$SNAPSHOT_WEBAPP_URL" > prime_snapshot_response.json

      - name: Verify Apps Script readback
        if: steps.gate.outputs.allowed == 'true'
        run: |
          python - <<'PY'
          import json
          payload = json.load(open("prime_snapshot_payload.json", encoding="utf-8"))
          response = json.load(open("prime_snapshot_response.json", encoding="utf-8"))
          if response.get("ok") is not True:
              raise SystemExit(f"Apps Script rejected update: {response}")
          if response.get("marker") != payload.get("marker"):
              raise SystemExit(f"Marker mismatch: {response.get('marker')} != {payload.get('marker')}")
          print(f"SNAPSHOT_UPDATE_OK document={response.get('documentId')} marker={response.get('marker')}")
          PY
