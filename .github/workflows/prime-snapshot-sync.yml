name: Prime Snapshot Sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heartbeat-audit-ingress-once
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.ref == 'refs/heads/audit/heartbeat-ingress-once' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout audit packet
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Append heartbeat audit to the Prime Snapshot Form
        env:
          PRIME_SNAPSHOT_EDIT_URL: ${{ secrets.PRIME_SNAPSHOT_EDIT_URL }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          class FreshForm(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.action = None
                  self.hidden = {}

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "form" and self.action is None:
                      self.action = attrs.get("action")
                  if tag == "input" and attrs.get("type") == "hidden":
                      name = attrs.get("name")
                      if name in {"fvv", "fbzx", "pageHistory", "partialResponse"}:
                          self.hidden[name] = attrs.get("value", "")

          def form_path(url, suffix):
              parts = urllib.parse.urlsplit(url)
              if parts.scheme != "https" or parts.netloc != "docs.google.com":
                  raise SystemExit("Unexpected Google Form host")
              match = re.fullmatch(r"(/forms/(?:u/\d+/)?d/(?:e/)?[A-Za-z0-9_-]+)/(?:viewform|formResponse)/?", parts.path)
              if not match:
                  raise SystemExit("Unexpected Google Form path")
              return f"https://docs.google.com{match[1]}/{suffix}"

          path = Path("logs/2026-11-08-heartbeat-audit.md")
          audit_bytes = path.read_bytes()
          blob = b"blob " + str(len(audit_bytes)).encode() + b"\0" + audit_bytes
          if hashlib.sha1(blob).hexdigest() != "85f431a48d4f0ec303e3b6eb628f6d1f7b055249":
              raise SystemExit("Audit blob mismatch")

          run_id = os.environ["GITHUB_RUN_ID"]
          marker = "SNAPSHOT_GENERATED_UTC: " + dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")
          digest = hashlib.sha256(audit_bytes).hexdigest()
          payload = (
              "# HumanVibe Prime Snapshot — LIVE\n"
              f"{marker}\n"
              "SOURCE_REPOSITORY: the1mburke-blip/Teamchat\n"
              "TRIGGER: workflow_dispatch\n"
              f"RUN_ID: {run_id}\n"
              "AUDIT_PR: 167\n"
              "AUDIT_SOURCE_COMMIT: ed86028a28af35ca2cd2b2eecf1dd3aa3aa161c8\n"
              "AUDIT_COMMIT: 969a11ebb834a2c33da5e874f5f508d675c957ad\n"
              f"AUDIT_SHA256: {digest}\n\n"
              + audit_bytes.decode("utf-8")
          )

          try:
              view = form_path(os.environ["PRIME_SNAPSHOT_EDIT_URL"], "viewform")
              with urllib.request.urlopen(view, timeout=25) as response:
                  view_url = response.geturl()
                  parser = FreshForm()
                  parser.feed(response.read().decode("utf-8"))
              if not parser.action:
                  raise SystemExit("Fresh Form did not expose a submit action")

              action = urllib.parse.urljoin(view_url, parser.action)
              target = form_path(view_url, "formResponse")
              if form_path(action, "formResponse") != target:
                  raise SystemExit("Fresh Form submit action points to a different Form")
              form_values = {
                  **parser.hidden,
                  "entry.1699301106": run_id,
                  "entry.807518215": marker,
                  "entry.465536805": "1",
                  "entry.1756592575": "1",
                  "entry.414143502": payload,
              }
              request = urllib.request.Request(
                  target,
                  data=urllib.parse.urlencode(form_values).encode(),
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=40) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  status = response.status
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Google Forms returned HTTP {error.code}") from None
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("Google Forms transport failed. Inspect the sheet before any retry.") from None

          if status != 200 or not any(
              text in body for text in ("Your response has been recorded", "Edit your response", "Submit another response")
          ):
              raise SystemExit(f"Form append confirmation missing (HTTP {status}). Inspect the sheet before any retry.")
          print(f"HEARTBEAT_AUDIT_FORM_APPEND_OK run_id={run_id} http={status} audit_sha256={digest}")
          PY
