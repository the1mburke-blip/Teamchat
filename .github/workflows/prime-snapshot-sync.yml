name: Prime Snapshot Sync

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  # issue_comment trigger removed 2026-10-28 (owner): every comment, including Icarus's replies, started a run. Disabled, not deleted.
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'STATUS.md'
      - 'OPERATING_RULES.md'
      - 'HANDOFF_PROTOCOL.md'
      - 'CONTENT_PIPELINE.md'
      - 'CHAT_LOG.md'
      - 'TRAINING_MATRIX.md'
      - 'BUFFER_QUEUE_STATE.md'
      - 'BLOG_QUEUE_STATE.md'
      - 'scripts/update_prime_snapshot.py'
      - 'scripts/prime_snapshot_sync.py'
  # Schedule removed 2026-10-28 (owner): GitHub Actions minutes are exhausted. Disabled, not deleted.
  workflow_dispatch:
    inputs:
      pulse_run_id:
        description: Originating ICARUS Pulse run ID
        type: string
        required: false
      pulse_event:
        description: Originating ICARUS Pulse event
        type: string
        required: false
      pulse_sha:
        description: Originating ICARUS Pulse checkout SHA
        type: string
        required: false

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: prime-snapshot-sync-${{ inputs.pulse_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.PRIME_SNAPSHOT_ENABLED == 'true' && github.ref == 'refs/heads/audit/icarus-canary-closeout-20261108' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Authorize event
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          name = os.environ["EVENT_NAME"]
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          allowed = True
          if name == "issue_comment":
              allowed = str(event.get("comment", {}).get("author_association", "")).upper() in {"OWNER","MEMBER","COLLABORATOR"}
          elif name == "issues":
              allowed = str(event.get("issue", {}).get("author_association", "")).upper() in {"OWNER","MEMBER","COLLABORATOR"}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"allowed={'true' if allowed else 'false'}\n")
          print("AUTHORIZED_EVENT" if allowed else "IGNORED_UNAUTHORIZED_EVENT")
          PY

      - name: Checkout canonical Teamchat
        if: steps.gate.outputs.allowed == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Refresh Buffer queue state
        id: buffer_refresh
        if: steps.gate.outputs.allowed == 'true' && github.ref == 'refs/heads/main' && !inputs.pulse_run_id && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          if [ -z "$BUFFER_API_KEY" ]; then
            echo "BUFFER_API_KEY_MISSING — retaining last verified queue state"
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/update_buffer_queue.py
          echo "refreshed=true" >> "$GITHUB_OUTPUT"

      - name: Persist refreshed Buffer queue state
        if: steps.buffer_refresh.outputs.refreshed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const path = 'BUFFER_QUEUE_STATE.md';
            const content = fs.readFileSync(path, 'utf8');
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            const existing = Buffer.from(current.data.content || '', 'base64').toString('utf8');
            if (existing === content) {
              core.notice('Buffer queue state unchanged; no commit needed.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'Refresh Buffer queue state',
              content: Buffer.from(content, 'utf8').toString('base64'),
              sha: current.data.sha,
              branch: 'main'
            });

      - name: Build compact Prime snapshot
        if: steps.gate.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULSE_RUN_ID: ${{ inputs.pulse_run_id }}
          PULSE_EVENT: ${{ inputs.pulse_event }}
          PULSE_SHA: ${{ inputs.pulse_sha }}
        run: python scripts/update_prime_snapshot.py

      - name: Include the verified Icarus canary receipt
        if: steps.gate.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts import icarus_duty_runner as runner

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          outbox = f"https://api.github.com/repos/{repo}/issues/6/comments"
          comments = runner.fetch_pages(outbox + "?since=2026-11-08T09:53:32Z", token)
          matches = [(comment, fields) for comment, fields in
                     runner.comment_packets(comments, runner.ADJUDICATION_HEADER, bot_only=True)
                     if fields["task id"] == "CANARY-INTAKE-001"]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one bot adjudication for CANARY-INTAKE-001")
          comment, fields = matches[0]
          link = f"https://github.com/{repo}/issues/6#issuecomment-"
          pulse = fields.get("pulse run id", "")
          if fields.get("work receipt") != link + "6720043721" or not pulse.isdecimal():
              raise SystemExit("Adjudication is missing the pinned Work receipt or Pulse run ID")
          path = Path("prime_snapshot_payload.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          header, _, contents = payload["snapshot"].partition("\n\n")
          proof = (
              "\n\n## Icarus canary adjudication\n"
              f"ADJUDICATION_COMMENT_ID: {comment['id']}\n"
              f"ADJUDICATION_LINK: {link}{comment['id']}\n"
              f"PULSE_RUN_ID: {pulse}\n"
              "PULSE_TRIGGER: workflow_dispatch (isolated adjudication harness)\n"
              f"PULSE_CHECKOUT_SHA: {os.environ['GITHUB_SHA']}\n"
              f"{comment['body'].strip()}\n\n"
          )
          payload["snapshot"] = (header + proof + contents)[:13940] + "\n[SNAPSHOT_TRUNCATED_TO_SAFE_CELL_LIMIT]\n"
          path.write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          print(f"ICARUS_LEDGER_PAYLOAD_OK comment_id={comment['id']} pulse_run_id={pulse}")
          PY

      - name: Append new Google Form response
        if: steps.gate.outputs.allowed == 'true'
        env:
          PRIME_SNAPSHOT_FORM_URL: ${{ secrets.PRIME_SNAPSHOT_FORM_URL }}
          PRIME_SNAPSHOT_EDIT_URL: ${{ secrets.PRIME_SNAPSHOT_EDIT_URL }}
        run: python scripts/prime_snapshot_sync.py
