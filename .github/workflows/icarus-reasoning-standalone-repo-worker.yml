name: Icarus Standalone Reasoning Repo Worker

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: icarus-standalone-reasoning-repo-worker
  cancel-in-progress: false

jobs:
  patch_reasoning:
    if: >-
      github.event.issue.number == 55 &&
      github.event.issue.pull_request == null &&
      contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
      github.event.comment.body == 'ICARUS_REASONING_STANDALONE_REPO_WORKER_RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Teamchat
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare isolated live-source candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC='drafts/icarus/2026-10-06-standalone-reasoning/live-source'
          DEST='drafts/icarus/2026-10-06-standalone-reasoning/candidate'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$SRC"/*.gs "$DEST"/
          sha256sum "$SRC"/*.gs | sort > /tmp/live-source-sha256.txt

      - name: Deterministic repo worker applies minimal continuation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          root=pathlib.Path('drafts/icarus/2026-10-06-standalone-reasoning/candidate')

          code_path=root/'Code.gs'
          code=code_path.read_text()
          pattern=re.compile(
              r"(    if \(op === 'submit'\) \{\n"
              r"      const task = createTask_\(auth\.deviceId, cleanText_\(body\.clientTaskId,256\), cleanText_\(body\.text,ICARUS\.MAX_TEXT\)\);\n)"
              r"      return jsonResponse_\(\{ok:true,data:advanceTask_\(task\.task_id\)\}\);\n"
              r"    \}"
          )
          match=pattern.search(code)
          if not match:
              raise SystemExit('LIVE_SUBMIT_BASELINE_NOT_FOUND')
          replacement=match.group(1)+"""      try {
                scheduleTaskAdvance_();
              } catch (scheduleErr) {
                try {
                  appendLog_(task.task_id,'RUNTIME','FAIL','Server-side continuation scheduling failed.','TASK_QUEUE:'+task.task_id,String(scheduleErr.message || scheduleErr));
                } catch (_) {}
              }
              return jsonResponse_({ok:true,data:taskForClient_(task.task_id)});
            }"""
          code,n=pattern.subn(replacement,code,count=1)
          if n != 1:
              raise SystemExit('SUBMIT_PATCH_COUNT_INVALID')
          code_path.write_text(code)

          runtime_path=root/'Runtime.gs'
          runtime=runtime_path.read_text()
          if 'function scheduleTaskAdvance_()' in runtime or 'function resumePendingTasksSoon_()' in runtime:
              raise SystemExit('CONTINUATION_HELPER_ALREADY_PRESENT')
          helpers="""

          function scheduleTaskAdvance_() {
            const handler = 'resumePendingTasksSoon_';
            const exists = ScriptApp.getProjectTriggers().some(function(t) {
              return t.getHandlerFunction() === handler;
            });
            if (exists) return;
            ScriptApp.newTrigger(handler).timeBased().after(1000).create();
          }

          function resumePendingTasksSoon_() {
            try {
              resumePendingTasks_();
            } finally {
              ScriptApp.getProjectTriggers().forEach(function(t) {
                if (t.getHandlerFunction() === 'resumePendingTasksSoon_') ScriptApp.deleteTrigger(t);
              });
            }
          }
          """
          runtime_path.write_text(runtime.rstrip()+helpers+'\n')
          PY

      - name: Deterministic independent verification
        shell: bash
        run: |
          set -euo pipefail
          SRC='drafts/icarus/2026-10-06-standalone-reasoning/live-source'
          DEST='drafts/icarus/2026-10-06-standalone-reasoning/candidate'

          for f in Code Runtime Provider Setup StateStore SignedAuth; do
            cp "$DEST/$f.gs" "/tmp/$f.js"
            node --check "/tmp/$f.js"
          done

          python - <<'PY'
          import pathlib,re
          src=pathlib.Path('drafts/icarus/2026-10-06-standalone-reasoning/live-source')
          dst=pathlib.Path('drafts/icarus/2026-10-06-standalone-reasoning/candidate')
          code=(dst/'Code.gs').read_text()
          rt=(dst/'Runtime.gs').read_text()

          start=code.index("if (op === 'submit')")
          end=code.index("if (op === 'status')",start)
          submit=code[start:end]
          assert 'createTask_(auth.deviceId, cleanText_(body.clientTaskId,256), cleanText_(body.text,ICARUS.MAX_TEXT))' in submit, 'SUBMIT_CREATE_TASK_CHANGED'
          assert 'scheduleTaskAdvance_();' in submit, 'SUBMIT_SERVER_SCHEDULE_MISSING'
          assert 'taskForClient_(task.task_id)' in submit, 'SUBMIT_TASK_ID_RESPONSE_MISSING'
          assert 'advanceTask_' not in submit, 'SUBMIT_STILL_SYNCHRONOUS'
          assert 'catch (scheduleErr)' in submit and 'appendLog_' in submit, 'SCHEDULE_FAILURE_NOT_CONTAINED'

          assert rt.count('function scheduleTaskAdvance_()') == 1, 'SCHEDULER_HELPER_COUNT'
          assert rt.count('function resumePendingTasksSoon_()') == 1, 'RESUME_HELPER_COUNT'
          assert "newTrigger(handler).timeBased().after(1000).create()" in rt, 'ONE_SHOT_TRIGGER_MISSING'
          assert 'resumePendingTasks_();' in rt, 'SERVER_CONTINUATION_MISSING'
          assert "getHandlerFunction() === 'resumePendingTasksSoon_'" in rt, 'TRIGGER_CLEANUP_FILTER_MISSING'
          assert 'deleteTrigger(t)' in rt, 'ONE_SHOT_TRIGGER_CLEANUP_MISSING'

          m=re.search(r"const eligible\s*=\s*\[([^\]]+)\]",rt)
          assert m, 'ELIGIBLE_LIST_MISSING'
          eligible=m.group(1)
          assert 'QUEUED' in eligible and 'INSPECTING' in eligible, 'PENDING_STATES_NOT_AUTO_ADVANCED'
          assert 'REASONING' not in eligible, 'BLIND_REASONING_RETRY_INTRODUCED'
          assert 'WAITING_REASONING_CAPACITY' not in eligible, 'BLIND_WAITING_RETRY_INTRODUCED'

          for f in ['Provider.gs','StateStore.gs','SignedAuth.gs','Setup.gs']:
              assert (src/f).read_bytes()==(dst/f).read_bytes(), f+' CHANGED_UNEXPECTEDLY'

          assert (src/'Code.gs').read_bytes() != (dst/'Code.gs').read_bytes(), 'CODE_NOT_CHANGED'
          assert (src/'Runtime.gs').read_bytes() != (dst/'Runtime.gs').read_bytes(), 'RUNTIME_NOT_CHANGED'

          print('STANDALONE_REASONING_CONTRACT=PASS')
          print('SUBMIT_RETURNS_CANONICAL_TASK_BEFORE_REASONING=PASS')
          print('SERVER_SIDE_CONTINUATION=PASS')
          print('BLIND_REASONING_RETRY_DENIED=PASS')
          print('PROVIDER_AUTH_STATE_SETUP_UNCHANGED=PASS')
          PY

      - name: Persist candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT='drafts/icarus/2026-10-06-standalone-reasoning'
          CAND="$ROOT/candidate"
          {
            echo '# Standalone reasoning deterministic repo-worker candidate'
            echo
            echo "- Executor: deterministic GitHub Actions repo worker"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Cost: €0"
            echo "- Changed candidate files: Code.gs, Runtime.gs"
            echo "- Provider/Auth/StateStore/Setup: byte-for-byte unchanged"
            echo "- Live deployment: NOT PERFORMED"
            echo "- Phone/ADB: NOT TOUCHED"
            echo
            echo '## Verification'
            echo '- JavaScript syntax: PASS'
            echo '- submit returns canonical persisted task before reasoning: PASS'
            echo '- server-side one-shot continuation: PASS'
            echo '- existing recurring pending-task fallback preserved: PASS'
            echo '- REASONING/WAITING blind timer retries remain excluded: PASS'
            echo '- Provider/Auth/StateStore/Setup unchanged: PASS'
            echo
            echo '## Live-source SHA-256'
            cat /tmp/live-source-sha256.txt
          } > "$ROOT/WORKER_EVIDENCE.md"
          git diff --no-index -- "$ROOT/live-source/Code.gs" "$CAND/Code.gs" > "$ROOT/Code.diff" || true
          git diff --no-index -- "$ROOT/live-source/Runtime.gs" "$CAND/Runtime.gs" > "$ROOT/Runtime.diff" || true

      - name: Commit isolated worker branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='repo-worker/icarus-reasoning-standalone-55'
          git config user.name 'icarus-deterministic-repo-worker'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add drafts/icarus/2026-10-06-standalone-reasoning
          git commit -m 'worker: make Icarus reasoning continuation phone-independent'
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update draft PR
        id: pr
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          SHA: ${{ steps.commit.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            const head=process.env.BRANCH;
            const existing=await github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+head,base:'main'});
            const body=[
              'Issue #55 deterministic repo-worker candidate.',
              '',
              'Target: return the canonical persisted task immediately, then continue reasoning server-side without Codex/ADB/laptop.',
              'Changed live-derived candidate files: Code.gs, Runtime.gs only.',
              'Provider/StateStore/SignedAuth/Setup preserved byte-for-byte.',
              'No live Apps Script deployment or phone mutation.',
              'Worker commit: '+process.env.SHA,
              'Evidence: drafts/icarus/2026-10-06-standalone-reasoning/WORKER_EVIDENCE.md',
              '',
              'Do not merge/deploy until independent review. Repo worker cannot self-award PASS.'
            ].join('\n');
            let pr;
            if (existing.data.length) {
              pr=existing.data[0];
              await github.rest.pulls.update({owner,repo,pull_number:pr.number,title:'Icarus standalone reasoning continuation — deterministic repo worker',body});
            } else {
              pr=(await github.rest.pulls.create({owner,repo,title:'Icarus standalone reasoning continuation — deterministic repo worker',head,base:'main',body,draft:true})).data;
            }
            core.setOutput('url',pr.html_url);

      - name: Report to issue 55
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          SHA: ${{ steps.commit.outputs.sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:55,
              body:[
                '[ICARUS_REASONING_DETERMINISTIC_REPO_WORKER]',
                'STATUS: CANDIDATE_BUILT_TESTED_PENDING_INDEPENDENT_REVIEW',
                'RUN: '+context.runId,
                'RUN_URL: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'BRANCH: '+process.env.BRANCH,
                'COMMIT: '+process.env.SHA,
                'PR: '+process.env.PR_URL,
                'TESTS: syntax + canonical-task response + server continuation + no blind reasoning retry + unchanged provider/auth/state/setup PASS',
                'BOUNDARY: no live deployment; no phone/ADB mutation; no router/failover work',
                'COST: €0'
              ].join('\n')
            });

      - name: Report worker failure
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:55,
              body:[
                '[ICARUS_REASONING_DETERMINISTIC_REPO_WORKER]',
                'STATUS: FAIL',
                'RUN: '+context.runId,
                'RUN_URL: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'ACTION: inspect exact deterministic failure; no blind retry.',
                'COST: €0'
              ].join('\n')
            });

  phone_deploy:
    if: >
      github.event_name == 'push' ||
      (
        github.event.issue.number == 55 &&
        github.event.comment.body == 'ICARUS_CLASP_PHONE_DEPLOY_RUN' &&
        github.event.comment.author_association == 'OWNER'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified candidate
        uses: actions/checkout@v4
        with:
          ref: repo-worker/icarus-reasoning-standalone-55
          persist-credentials: false

      - name: Install clasp and pexpect
        run: |
          npm install -g @google/clasp@3.2.0
          python -m pip install --quiet pexpect cryptography
          clasp --version

      - name: Headless owner auth and deploy verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: "55"
          SCRIPT_ID: "14k-ImKDntPPXhhFC7Wzj-2nMEbRIxNxNBDFRtRt03Q-5E5132k7r-wGL"
          DEPLOYMENT_ID: "AKfycbw7k-w7MVQt81U8vB3tJfLNsa3vvglvl1ANR2eIzsx2YJMJeifn5DrbnVWVy7rxocwJXw"
          BASE_CODE_SHA: "31254738eeb5f4537a0efffb16dd2adaa10bdf529bd4797038fc833203c94af1"
          BASE_RUNTIME_SHA: "d9049f33ed869329572acc2b713ccc8d32c42fab06a4af560f33e14e09a53f90"
          CAND_CODE_SHA: "4d1e50ed7e30fad55307032bbcda7278b83221dcaea09d8a0f95f739758852f9"
          CAND_RUNTIME_SHA: "0d672dc5c01e09b79df77ce0c190f68e154cff40b7c7b42f12c1f1c7459593ea"
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/icarus_oauth_private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/icarus_oauth_private.pem -out /tmp/icarus_oauth_public.pem >/dev/null 2>&1
          python <<'PY'
          import os, re, time, json, base64, subprocess, pexpect, sys
          repo=os.environ["REPO"]; issue=os.environ["ISSUE"]
          child=pexpect.spawn("clasp", ["login","--no-localhost","--user","icarus-phone"], encoding="utf-8", timeout=120)
          auth_url=None
          deadline=time.time()+120
          buf=""
          while time.time()<deadline and auth_url is None:
              try:
                  x=child.read_nonblocking(size=4096, timeout=5)
                  buf += x
                  m=re.search(r'https://accounts\.google\.com/[^\s]+', buf)
                  if m: auth_url=m.group(0)
              except pexpect.TIMEOUT:
                  pass
              except pexpect.EOF:
                  break
          if not auth_url:
              print("AUTH_URL_NOT_FOUND")
              print(buf[-2000:])
              sys.exit(2)
          pub=open("/tmp/icarus_oauth_public.pem","rb").read()
          pub64=base64.b64encode(pub).decode()
          body=f"""[ICARUS_CLASP_PHONE_AUTH]
STATUS: OWNER_AUTH_REQUIRED
RUN_ID: {os.environ.get('GITHUB_RUN_ID','')}
AUTH_URL: {auth_url}
PUBLIC_KEY_B64: {pub64}
INSTRUCTION: Open AUTH_URL on the phone. After Google redirects to the localhost page, copy the FULL address-bar URL back to ChatGPT. Do not post it publicly.
"""
          subprocess.run(["gh","api",f"repos/{repo}/issues/{issue}/comments","-f",f"body={body}"],check=True,stdout=subprocess.DEVNULL)
          marker=f"[ICARUS_CLASP_OAUTH_CIPHERTEXT:{os.environ.get('GITHUB_RUN_ID','')}]"
          encrypted=None
          for _ in range(180):
              out=subprocess.check_output(["gh","api",f"repos/{repo}/issues/{issue}/comments?per_page=100"],text=True)
              comments=json.loads(out)
              for c in reversed(comments):
                  b=c.get("body","")
                  if b.startswith(marker):
                      encrypted=b[len(marker):].strip()
                      break
              if encrypted: break
              time.sleep(5)
          if not encrypted:
              subprocess.run(["gh","api",f"repos/{repo}/issues/{issue}/comments","-f","body=[ICARUS_CLASP_PHONE_DEPLOY] STATUS: BLOCKED — encrypted OAuth callback not received before timeout."],check=True,stdout=subprocess.DEVNULL)
              sys.exit(3)
          open("/tmp/cipher.b64","w").write(encrypted)
          subprocess.run("base64 -d /tmp/cipher.b64 > /tmp/cipher.bin",shell=True,check=True)
          subprocess.run("openssl pkeyutl -decrypt -inkey /tmp/icarus_oauth_private.pem -in /tmp/cipher.bin -out /tmp/callback.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256",shell=True,check=True)
          callback=open("/tmp/callback.txt").read().strip()
          child.sendline(callback)
          child.expect(pexpect.EOF, timeout=120)
          rc=child.exitstatus
          if rc not in (0,None):
              print(child.before[-2000:])
              sys.exit(4)
          PY

          AUTH_JSON="$(clasp --user icarus-phone --json show-authorized-user)"
          echo "$AUTH_JSON" | jq -e '.email != null' >/dev/null

          mkdir -p /tmp/icarus-deploy
          cd /tmp/icarus-deploy
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json
          clasp --user icarus-phone pull

          CODE_FILE="$(find . -maxdepth 1 -type f \( -name 'Code.js' -o -name 'Code.gs' \) | head -1)"
          RUNTIME_FILE="$(find . -maxdepth 1 -type f \( -name 'Runtime.js' -o -name 'Runtime.gs' \) | head -1)"
          test -n "$CODE_FILE" && test -n "$RUNTIME_FILE"
          test "$(sha256sum "$CODE_FILE" | awk '{print $1}')" = "$BASE_CODE_SHA"
          test "$(sha256sum "$RUNTIME_FILE" | awk '{print $1}')" = "$BASE_RUNTIME_SHA"

          cp "$GITHUB_WORKSPACE/drafts/icarus/2026-10-06-standalone-reasoning/candidate/Code.gs" "$CODE_FILE"
          cp "$GITHUB_WORKSPACE/drafts/icarus/2026-10-06-standalone-reasoning/candidate/Runtime.gs" "$RUNTIME_FILE"
          test "$(sha256sum "$CODE_FILE" | awk '{print $1}')" = "$CAND_CODE_SHA"
          test "$(sha256sum "$RUNTIME_FILE" | awk '{print $1}')" = "$CAND_RUNTIME_SHA"

          clasp --user icarus-phone show-file-status --json > /tmp/status-before-push.json
          clasp --user icarus-phone push --force
          BEFORE="$(clasp --user icarus-phone --json list-deployments)"
          clasp --user icarus-phone create-deployment --deploymentId "$DEPLOYMENT_ID" --description "Icarus standalone reasoning PR56"
          AFTER="$(clasp --user icarus-phone --json list-deployments)"
          echo "$AFTER" | jq -e --arg id "$DEPLOYMENT_ID" '.. | objects | select(.deploymentId? == $id)' >/dev/null

          rm -rf /tmp/icarus-readback
          mkdir /tmp/icarus-readback
          cd /tmp/icarus-readback
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json
          clasp --user icarus-phone pull
          CODE_RB="$(find . -maxdepth 1 -type f \( -name 'Code.js' -o -name 'Code.gs' \) | head -1)"
          RUNTIME_RB="$(find . -maxdepth 1 -type f \( -name 'Runtime.js' -o -name 'Runtime.gs' \) | head -1)"
          test "$(sha256sum "$CODE_RB" | awk '{print $1}')" = "$CAND_CODE_SHA"
          test "$(sha256sum "$RUNTIME_RB" | awk '{print $1}')" = "$CAND_RUNTIME_SHA"

          EMAIL="$(echo "$AUTH_JSON" | jq -r '.email')"
          BODY="[ICARUS_CLASP_PHONE_DEPLOY]
STATUS: READY_FOR_OWNER_STANDALONE_CANARY
RUN_ID: $GITHUB_RUN_ID
EXECUTOR: GitHub-hosted repo worker via clasp 3.2.0
SCRIPT_ID: $SCRIPT_ID
DEPLOYMENT_ID: $DEPLOYMENT_ID
AUTHORIZED_USER: $EMAIL
CODE_SHA256: $CAND_CODE_SHA
RUNTIME_SHA256: $CAND_RUNTIME_SHA
SOURCE_READBACK: MATCH
ANDROID/PAIRING/SIGNING: UNTOUCHED
COST: €0
PASS: NOT CLAIMED — requires fresh standalone Redmi canary with laptop/Codex/ADB absent."
          gh api "repos/$REPO/issues/$ISSUE/comments" -f "body=$BODY" >/dev/null
