name: Icarus Reasoning-Only Repo Worker

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: icarus-standalone-reasoning-repo-worker
  cancel-in-progress: false

jobs:
  patch_reasoning:
    if: >-
      github.event.issue.number == 55 &&
      github.event.issue.pull_request == null &&
      contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
      github.event.comment.body == 'ICARUS_REASONING_STANDALONE_REPO_WORKER_RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Teamchat
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare isolated live-source candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC='drafts/icarus/2026-10-06-standalone-reasoning/live-source'
          DEST='drafts/icarus/2026-10-06-standalone-reasoning/candidate'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$SRC"/*.gs "$DEST"/
          sha256sum "$SRC"/*.gs | sort > /tmp/live-source-sha256.txt

      - name: Deterministic repo worker applies minimal continuation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re
          root=pathlib.Path('drafts/icarus/2026-10-06-standalone-reasoning/candidate')

          code_path=root/'Code.gs'
          code=code_path.read_text()
          pattern=re.compile(
              r"(    if \(op === 'submit'\) \{\n"
              r"      const task = createTask_\(auth\.deviceId, cleanText_\(body\.clientTaskId,256\), cleanText_\(body\.text,ICARUS\.MAX_TEXT\)\);\n)"
              r"      return jsonResponse_\(\{ok:true,data:advanceTask_\(task\.task_id\)\}\);\n"
              r"    \}"
          )
          match=pattern.search(code)
          if not match:
              raise SystemExit('LIVE_SUBMIT_BASELINE_NOT_FOUND')
          replacement=match.group(1)+"""      try {
                scheduleTaskAdvance_();
              } catch (scheduleErr) {
                try {
                  appendLog_(task.task_id,'RUNTIME','FAIL','Server-side continuation scheduling failed.','TASK_QUEUE:'+task.task_id,String(scheduleErr.message || scheduleErr));
                } catch (_) {}
              }
              return jsonResponse_({ok:true,data:taskForClient_(task.task_id)});
            }"""
          code,n=pattern.subn(replacement,code,count=1)
          if n != 1:
              raise SystemExit('SUBMIT_PATCH_COUNT_INVALID')
          code_path.write_text(code)

          runtime_path=root/'Runtime.gs'
          runtime=runtime_path.read_text()
          stop_old="""      if (reasoning.status !== 'READY_FOR_EXECUTION') throw new Error('REASONING_BLOCKED');
      transitionTask_(taskId,'EXECUTING');
    }
    return executeComposioTask_(taskId,reasoning && reasoning.executionRequest);"""
          stop_new="""      if (reasoning.status !== 'READY_FOR_EXECUTION') throw new Error('REASONING_BLOCKED');
      transitionTask_(taskId,'REASONING',{evidence_ref:reasoning.evidence});
      return taskForClient_(taskId);
    }
    return taskForClient_(taskId);"""
          if stop_old not in runtime:
              raise SystemExit('REASONING_TO_COMPOSIO_BASELINE_NOT_FOUND')
          runtime=runtime.replace(stop_old,stop_new,1)
          if 'function scheduleTaskAdvance_()' in runtime or 'function resumePendingTasksSoon_()' in runtime:
              raise SystemExit('CONTINUATION_HELPER_ALREADY_PRESENT')
          helpers="""

          function scheduleTaskAdvance_() {
            const handler = 'resumePendingTasksSoon_';
            const exists = ScriptApp.getProjectTriggers().some(function(t) {
              return t.getHandlerFunction() === handler;
            });
            if (exists) return;
            ScriptApp.newTrigger(handler).timeBased().after(1000).create();
          }

          function resumePendingTasksSoon_() {
            try {
              resumePendingTasks_();
            } finally {
              ScriptApp.getProjectTriggers().forEach(function(t) {
                if (t.getHandlerFunction() === 'resumePendingTasksSoon_') ScriptApp.deleteTrigger(t);
              });
            }
          }
          """
          runtime_path.write_text(runtime.rstrip()+helpers+'\n')
          PY

      - name: Deterministic independent verification
        shell: bash
        run: |
          set -euo pipefail
          SRC='drafts/icarus/2026-10-06-standalone-reasoning/live-source'
          DEST='drafts/icarus/2026-10-06-standalone-reasoning/candidate'

          for f in Code Runtime Provider Setup StateStore SignedAuth; do
            cp "$DEST/$f.gs" "/tmp/$f.js"
            node --check "/tmp/$f.js"
          done

          python - <<'PY'
          import pathlib,re
          src=pathlib.Path('drafts/icarus/2026-10-06-standalone-reasoning/live-source')
          dst=pathlib.Path('drafts/icarus/2026-10-06-standalone-reasoning/candidate')
          code=(dst/'Code.gs').read_text()
          rt=(dst/'Runtime.gs').read_text()

          start=code.index("if (op === 'submit')")
          end=code.index("if (op === 'status')",start)
          submit=code[start:end]
          assert 'createTask_(auth.deviceId, cleanText_(body.clientTaskId,256), cleanText_(body.text,ICARUS.MAX_TEXT))' in submit, 'SUBMIT_CREATE_TASK_CHANGED'
          assert 'scheduleTaskAdvance_();' in submit, 'SUBMIT_SERVER_SCHEDULE_MISSING'
          assert 'taskForClient_(task.task_id)' in submit, 'SUBMIT_TASK_ID_RESPONSE_MISSING'
          assert 'advanceTask_' not in submit, 'SUBMIT_STILL_SYNCHRONOUS'
          assert 'catch (scheduleErr)' in submit and 'appendLog_' in submit, 'SCHEDULE_FAILURE_NOT_CONTAINED'

          assert rt.count('function scheduleTaskAdvance_()') == 1, 'SCHEDULER_HELPER_COUNT'
          assert rt.count('function resumePendingTasksSoon_()') == 1, 'RESUME_HELPER_COUNT'
          assert "newTrigger(handler).timeBased().after(1000).create()" in rt, 'ONE_SHOT_TRIGGER_MISSING'
          assert 'resumePendingTasks_();' in rt, 'SERVER_CONTINUATION_MISSING'
          advance=rt[rt.index('function advanceTaskLocked_'):rt.index('function resumePendingTasks_')]
          assert 'executeComposioTask_' not in advance, 'COMPOSIO_CALL_REMAINS_IN_REASONING_PATH'
          assert "transitionTask_(taskId,'REASONING',{evidence_ref:reasoning.evidence})" in advance, 'REASONING_EVIDENCE_NOT_PERSISTED'
          assert advance.count('return taskForClient_(taskId);') >= 2, 'REASONING_ONLY_STOP_MISSING'
          assert "transitionTask_(taskId,'EXECUTING')" not in advance, 'REASONING_STILL_TRANSITIONS_TO_EXECUTING'
          assert "getHandlerFunction() === 'resumePendingTasksSoon_'" in rt, 'TRIGGER_CLEANUP_FILTER_MISSING'
          assert 'deleteTrigger(t)' in rt, 'ONE_SHOT_TRIGGER_CLEANUP_MISSING'

          m=re.search(r"const eligible\s*=\s*\[([^\]]+)\]",rt)
          assert m, 'ELIGIBLE_LIST_MISSING'
          eligible=m.group(1)
          assert 'QUEUED' in eligible and 'INSPECTING' in eligible, 'PENDING_STATES_NOT_AUTO_ADVANCED'
          assert 'REASONING' not in eligible, 'BLIND_REASONING_RETRY_INTRODUCED'
          assert 'WAITING_REASONING_CAPACITY' not in eligible, 'BLIND_WAITING_RETRY_INTRODUCED'

          for f in ['Provider.gs','StateStore.gs','SignedAuth.gs','Setup.gs']:
              assert (src/f).read_bytes()==(dst/f).read_bytes(), f+' CHANGED_UNEXPECTEDLY'

          assert (src/'Code.gs').read_bytes() != (dst/'Code.gs').read_bytes(), 'CODE_NOT_CHANGED'
          assert (src/'Runtime.gs').read_bytes() != (dst/'Runtime.gs').read_bytes(), 'RUNTIME_NOT_CHANGED'

          print('STANDALONE_REASONING_CONTRACT=PASS')
          print('SUBMIT_RETURNS_CANONICAL_TASK_BEFORE_REASONING=PASS')
          print('SERVER_SIDE_CONTINUATION=PASS')
          print('BLIND_REASONING_RETRY_DENIED=PASS')
          print('PROVIDER_AUTH_STATE_SETUP_UNCHANGED=PASS')
          PY

      - name: Persist candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT='drafts/icarus/2026-10-06-standalone-reasoning'
          CAND="$ROOT/candidate"
          {
            echo '# Standalone reasoning deterministic repo-worker candidate'
            echo
            echo "- Executor: deterministic GitHub Actions repo worker"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Cost: €0"
            echo "- Changed candidate files: Code.gs, Runtime.gs"
            echo "- Provider/Auth/StateStore/Setup: byte-for-byte unchanged"
            echo "- Live deployment: NOT PERFORMED"
            echo "- Phone/ADB: NOT TOUCHED"
            echo
            echo '## Verification'
            echo '- JavaScript syntax: PASS'
            echo '- submit returns canonical persisted task before reasoning: PASS'
            echo '- server-side one-shot continuation: PASS'
            echo '- successful Gemini reasoning persists evidence and stops in REASONING: PASS'
            echo '- Composio call absent from advanceTaskLocked_: PASS'
            echo '- existing recurring pending-task fallback preserved: PASS'
            echo '- REASONING/WAITING blind timer retries remain excluded: PASS'
            echo '- Provider/Auth/StateStore/Setup unchanged: PASS'
            echo
            echo '## Live-source SHA-256'
            cat /tmp/live-source-sha256.txt
          } > "$ROOT/WORKER_EVIDENCE.md"
          git diff --no-index -- "$ROOT/live-source/Code.gs" "$CAND/Code.gs" > "$ROOT/Code.diff" || true
          git diff --no-index -- "$ROOT/live-source/Runtime.gs" "$CAND/Runtime.gs" > "$ROOT/Runtime.diff" || true

      - name: Commit isolated worker branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='repo-worker/icarus-reasoning-standalone-55'
          git config user.name 'icarus-deterministic-repo-worker'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add drafts/icarus/2026-10-06-standalone-reasoning
          git commit -m 'worker: make Icarus reasoning continuation phone-independent'
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update draft PR
        id: pr
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          SHA: ${{ steps.commit.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            const head=process.env.BRANCH;
            const existing=await github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+head,base:'main'});
            const body=[
              'Issue #55 deterministic repo-worker candidate.',
              '',
              'Target: return the canonical persisted task immediately, continue Google/Gemini reasoning server-side, persist sanitized reasoning evidence, and stop before Composio.',
              'Changed live-derived candidate files: Code.gs, Runtime.gs only.',
              'Provider/StateStore/SignedAuth/Setup preserved byte-for-byte.',
              'No live Apps Script deployment or phone mutation.',
              'Worker commit: '+process.env.SHA,
              'Evidence: drafts/icarus/2026-10-06-standalone-reasoning/WORKER_EVIDENCE.md',
              '',
              'Do not merge/deploy until independent review. Repo worker cannot self-award PASS.'
            ].join('\n');
            let pr;
            if (existing.data.length) {
              pr=existing.data[0];
              await github.rest.pulls.update({owner,repo,pull_number:pr.number,title:'Icarus standalone reasoning continuation — deterministic repo worker',body});
            } else {
              pr=(await github.rest.pulls.create({owner,repo,title:'Icarus standalone reasoning continuation — deterministic repo worker',head,base:'main',body,draft:true})).data;
            }
            core.setOutput('url',pr.html_url);

      - name: Report to issue 55
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          SHA: ${{ steps.commit.outputs.sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:55,
              body:[
                '[ICARUS_REASONING_DETERMINISTIC_REPO_WORKER]',
                'STATUS: CANDIDATE_BUILT_TESTED_PENDING_INDEPENDENT_REVIEW',
                'RUN: '+context.runId,
                'RUN_URL: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'BRANCH: '+process.env.BRANCH,
                'COMMIT: '+process.env.SHA,
                'PR: '+process.env.PR_URL,
                'TESTS: syntax + canonical-task response + server continuation + reasoning evidence persisted + hard stop before Composio + no blind reasoning retry + unchanged provider/auth/state/setup PASS',
                'BOUNDARY: no live deployment; no phone/ADB mutation; Composio excluded; no router/failover work',
                'COST: €0'
              ].join('\n')
            });

      - name: Report worker failure
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:55,
              body:[
                '[ICARUS_REASONING_DETERMINISTIC_REPO_WORKER]',
                'STATUS: FAIL',
                'RUN: '+context.runId,
                'RUN_URL: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'ACTION: inspect exact deterministic failure; no blind retry.',
                'COST: €0'
              ].join('\n')
            });
