name: Icarus Standalone Reasoning Repo Worker

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: icarus-standalone-reasoning-repo-worker
  cancel-in-progress: false

jobs:
  patch_reasoning:
    if: >-
      github.event.issue.number == 55 &&
      github.event.issue.pull_request == null &&
      contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
      github.event.comment.body == 'ICARUS_REASONING_STANDALONE_REPO_WORKER_RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Teamchat
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare isolated live-source candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC='drafts/icarus/2026-10-06-standalone-reasoning/live-source'
          DEST='drafts/icarus/2026-10-06-standalone-reasoning/candidate'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$SRC"/*.gs "$DEST"/
          sha256sum "$SRC"/*.gs | sort > /tmp/live-source-sha256.txt

      - name: Install bounded Qwen coding worker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers accelerate safetensors sentencepiece

      - name: Generate two bounded code hunks and apply them
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch_reasoning_v2.py <<'PY'
          import pathlib, re, torch
          from transformers import AutoTokenizer, AutoModelForCausalLM

          root=pathlib.Path('drafts/icarus/2026-10-06-standalone-reasoning/candidate')
          code=(root/'Code.gs').read_text()
          runtime=(root/'Runtime.gs').read_text()
          setup=(root/'Setup.gs').read_text()

          model_id='Qwen/Qwen2.5-Coder-1.5B-Instruct'
          tok=AutoTokenizer.from_pretrained(model_id)
          model=AutoModelForCausalLM.from_pretrained(model_id,dtype=torch.float32,low_cpu_mem_usage=True)
          model.eval()

          def gen(prompt,max_new):
              rendered=tok.apply_chat_template([{'role':'user','content':prompt}],tokenize=False,add_generation_prompt=True)
              inp=tok(rendered,return_tensors='pt')
              with torch.inference_mode():
                  out=model.generate(**inp,max_new_tokens=max_new,do_sample=False,repetition_penalty=1.03,pad_token_id=tok.eos_token_id)
              txt=tok.decode(out[0][inp['input_ids'].shape[1]:],skip_special_tokens=True).strip()
              txt=re.sub(r'^\x60\x60\x60(?:javascript|js)?\s*','',txt,flags=re.I)
              txt=re.sub(r'\s*\x60\x60\x60$','',txt).strip()
              return txt

          submit_re=re.compile(r"    if \(op === 'submit'\) \{[\s\S]*?\n    \}\n    if \(op === 'status'\)")
          m=submit_re.search(code)
          if not m:
              raise SystemExit('SUBMIT_BLOCK_NOT_FOUND')
          current=m.group(0).rsplit("    if (op === 'status')",1)[0].rstrip()

          submit_prompt=f"""
          Return ONLY a JavaScript replacement for this one if-block. No markdown, no surrounding function.

          CURRENT BLOCK:
          {current}

          REQUIRED:
          - Keep createTask_ arguments exactly unchanged.
          - After persistence, inside try call exactly: scheduleTaskAdvance_();
          - If scheduling throws, catch it, append a RUNTIME log for the same task with status FAIL and evidence TASK_QUEUE:<task_id>, but DO NOT fail the submit response.
          - Never call advanceTask_ in this block.
          - Return jsonResponse_ with ok:true and data:taskForClient_(task.task_id).
          - No new endpoint, auth, provider, database or credential.
          - Keep the block compact.
          """
          submit=gen(submit_prompt,550)
          if "if (op === 'submit')" not in submit or 'scheduleTaskAdvance_();' not in submit or 'taskForClient_' not in submit or 'advanceTask_' in submit:
              raise SystemExit('SUBMIT_HUNK_INVALID')
          if 'createTask_(auth.deviceId' not in submit:
              raise SystemExit('SUBMIT_CREATE_TASK_CHANGED')
          code=submit_re.sub(submit+"\n    if (op === 'status')",code,count=1)
          (root/'Code.gs').write_text(code)

          helper_prompt="""
          Return ONLY valid JavaScript source defining exactly these two top-level Google Apps Script functions. No markdown and no prose.

          1. function scheduleTaskAdvance_()
             - Read ScriptApp.getProjectTriggers().
             - If any trigger getHandlerFunction() equals 'resumePendingTasksSoon_', return without creating a duplicate.
             - Otherwise create exactly one time-based trigger:
               ScriptApp.newTrigger('resumePendingTasksSoon_').timeBased().after(1000).create();

          2. function resumePendingTasksSoon_()
             - In try, call resumePendingTasks_() exactly once.
             - In finally, enumerate ScriptApp.getProjectTriggers() and delete every trigger whose getHandlerFunction() equals 'resumePendingTasksSoon_'.
             - Do not call Gemini, reason_, advanceTask_, or any external service directly.
             - Do not alter task states yourself.

          No other functions, variables, services, endpoints or comments are needed.
          """
          helpers=gen(helper_prompt,700)
          required=['function scheduleTaskAdvance_()','function resumePendingTasksSoon_()',"newTrigger('resumePendingTasksSoon_')",'after(1000)','resumePendingTasks_();',"deleteTrigger"]
          if any(x not in helpers for x in required):
              raise SystemExit('RUNTIME_HUNK_INVALID')
          forbidden=['reason_(','gemini','UrlFetchApp','advanceTask_(']
          if any(x.lower() in helpers.lower() for x in forbidden):
              raise SystemExit('RUNTIME_HUNK_SCOPE_EXPANSION')
          if 'function scheduleTaskAdvance_' in runtime or 'function resumePendingTasksSoon_' in runtime:
              raise SystemExit('RUNTIME_HELPER_ALREADY_EXISTS')
          runtime=runtime.rstrip()+"\n\n"+helpers.strip()+"\n"
          (root/'Runtime.gs').write_text(runtime)

          if 'everyMinutes(5).create()' not in setup.replace(' ',''):
              raise SystemExit('SETUP_BASELINE_CADENCE_NOT_FOUND')
          setup=setup.replace('everyMinutes(5).create()','everyMinutes(1).create()')
          (root/'Setup.gs').write_text(setup)
          PY
          python /tmp/patch_reasoning_v2.py

      - name: Deterministic independent verification
        shell: bash
        run: |
          set -euo pipefail
          SRC='drafts/icarus/2026-10-06-standalone-reasoning/live-source'
          DEST='drafts/icarus/2026-10-06-standalone-reasoning/candidate'

          for f in Code Runtime Provider Setup StateStore SignedAuth; do
            cp "$DEST/$f.gs" "/tmp/$f.js"
            node --check "/tmp/$f.js"
          done

          python - <<'PY'
          import pathlib,re
          src=pathlib.Path('drafts/icarus/2026-10-06-standalone-reasoning/live-source')
          dst=pathlib.Path('drafts/icarus/2026-10-06-standalone-reasoning/candidate')
          code=(dst/'Code.gs').read_text()
          rt=(dst/'Runtime.gs').read_text()
          setup=(dst/'Setup.gs').read_text()

          start=code.index("if (op === 'submit')")
          end=code.index("if (op === 'status')",start)
          submit=code[start:end]
          assert 'createTask_(auth.deviceId' in submit, 'SUBMIT_CREATE_TASK_MISSING'
          assert 'scheduleTaskAdvance_();' in submit, 'SUBMIT_SCHEDULE_CALL_NOT_EXACT'
          assert 'taskForClient_(task.task_id)' in submit, 'SUBMIT_TASK_ID_RESPONSE_MISSING'
          assert 'advanceTask_' not in submit, 'SUBMIT_STILL_SYNCHRONOUS'
          assert 'catch' in submit and 'appendLog_' in submit, 'SUBMIT_SCHEDULE_FAILURE_NOT_LOGGED'

          assert rt.count('function scheduleTaskAdvance_()') == 1
          assert rt.count('function resumePendingTasksSoon_()') == 1
          assert "newTrigger('resumePendingTasksSoon_')" in rt
          assert 'after(1000)' in rt
          assert 'resumePendingTasks_();' in rt
          assert "getHandlerFunction() === 'resumePendingTasksSoon_'" in rt
          assert 'deleteTrigger' in rt

          m=re.search(r"const eligible\s*=\s*\[([^\]]+)\]",rt)
          assert m, 'eligible list missing'
          eligible=m.group(1)
          assert 'QUEUED' in eligible and 'INSPECTING' in eligible
          assert 'REASONING' not in eligible
          assert 'WAITING_REASONING_CAPACITY' not in eligible

          assert 'everyMinutes(1).create()' in setup.replace(' ','')
          assert 'everyMinutes(5)' not in setup

          for f in ['Provider.gs','StateStore.gs','SignedAuth.gs']:
              assert (src/f).read_bytes()==(dst/f).read_bytes(), f+' changed unexpectedly'

          print('STANDALONE_REASONING_CONTRACT=PASS')
          print('SUBMIT_RETURNS_TASK_ID_BEFORE_REASONING=PASS')
          print('SERVER_SIDE_CONTINUATION=PASS')
          print('DUPLICATE_REASONING_TIMER_RETRY_DENIED=PASS')
          print('PROVIDER_STATE_AUTH_UNCHANGED=PASS')
          PY

      - name: Persist candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT='drafts/icarus/2026-10-06-standalone-reasoning'
          CAND="$ROOT/candidate"
          {
            echo '# Standalone reasoning repo-worker candidate'
            echo
            echo "- Worker: Qwen/Qwen2.5-Coder-1.5B-Instruct"
            echo "- Host: GitHub Actions public CPU runner"
            echo "- Run: $GITHUB_RUN_ID"
            echo "- Cost: €0"
            echo "- Scope: Code.gs, Runtime.gs, Setup.gs only"
            echo "- Live deployment: NOT PERFORMED"
            echo "- Phone/ADB: NOT TOUCHED"
            echo
            echo '## Verification'
            echo '- JavaScript syntax: PASS'
            echo '- submit returns persisted task ID without inline advanceTask_: PASS'
            echo '- one-shot server continuation: PASS'
            echo '- recurring fallback trigger 1 minute: PASS'
            echo '- blind REASONING/WAITING timer retries remain excluded: PASS'
            echo '- Provider.gs unchanged: PASS'
            echo '- StateStore.gs unchanged: PASS'
            echo '- SignedAuth.gs unchanged: PASS'
            echo
            echo '## Live-source SHA-256'
            cat /tmp/live-source-sha256.txt
          } > "$ROOT/WORKER_EVIDENCE.md"
          git diff --no-index -- "$ROOT/live-source/Code.gs" "$CAND/Code.gs" > "$ROOT/Code.diff" || true
          git diff --no-index -- "$ROOT/live-source/Runtime.gs" "$CAND/Runtime.gs" > "$ROOT/Runtime.diff" || true
          git diff --no-index -- "$ROOT/live-source/Setup.gs" "$CAND/Setup.gs" > "$ROOT/Setup.diff" || true

      - name: Commit isolated worker branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='repo-worker/icarus-reasoning-standalone-55'
          git config user.name 'icarus-reasoning-repo-worker'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add drafts/icarus/2026-10-06-standalone-reasoning
          git commit -m 'ghost: patch standalone Icarus reasoning continuation'
          git push --force-with-lease origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open or update draft PR
        id: pr
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          SHA: ${{ steps.commit.outputs.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            const head=process.env.BRANCH;
            const existing=await github.rest.pulls.list({owner,repo,state:'open',head:owner+':'+head,base:'main'});
            const body=[
              'Issue #55 repo-worker candidate.',
              '',
              'Target: return persisted task immediately, then continue reasoning server-side without Codex/ADB/laptop.',
              'Changed live-derived candidate files: Code.gs, Runtime.gs, Setup.gs.',
              'Provider/StateStore/SignedAuth preserved byte-for-byte.',
              'No live Apps Script deployment or phone mutation.',
              'Worker commit: '+process.env.SHA,
              'Evidence: drafts/icarus/2026-10-06-standalone-reasoning/WORKER_EVIDENCE.md',
              '',
              'Do not merge/deploy until independent review. Executor cannot self-award PASS.'
            ].join('\n');
            let pr;
            if (existing.data.length) {
              pr=existing.data[0];
              await github.rest.pulls.update({owner,repo,pull_number:pr.number,title:'Icarus standalone reasoning continuation — repo worker',body});
            } else {
              pr=(await github.rest.pulls.create({owner,repo,title:'Icarus standalone reasoning continuation — repo worker',head,base:'main',body,draft:true})).data;
            }
            core.setOutput('url',pr.html_url);

      - name: Report to issue 55
        uses: actions/github-script@v8
        env:
          BRANCH: ${{ steps.commit.outputs.branch }}
          SHA: ${{ steps.commit.outputs.sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:55,
              body:[
                '[ICARUS_REASONING_REPO_WORKER]',
                'STATUS: CANDIDATE_BUILT_TESTED_PENDING_INDEPENDENT_REVIEW',
                'WORKER: Qwen/Qwen2.5-Coder-1.5B-Instruct',
                'HOST: GitHub Actions public CPU runner',
                'RUN: '+context.runId,
                'RUN_URL: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'BRANCH: '+process.env.BRANCH,
                'COMMIT: '+process.env.SHA,
                'PR: '+process.env.PR_URL,
                'TESTS: syntax + submit contract + autonomous continuation + unchanged provider/auth/state PASS',
                'BOUNDARY: no live deployment; no phone/ADB mutation; no router/failover work',
                'COST: €0'
              ].join('\n')
            });

      - name: Report worker failure
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:55,
              body:[
                '[ICARUS_REASONING_REPO_WORKER]',
                'STATUS: FAIL',
                'RUN: '+context.runId,
                'RUN_URL: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'ACTION: inspect exact failure; no blind retry.',
                'COST: €0'
              ].join('\n')
            });
