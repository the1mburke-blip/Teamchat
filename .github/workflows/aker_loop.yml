name: (retired) Aker handoff check - manual only

on:
  # Retired 2026-10-28: daily schedule removed (it only wrote HANDOFF_READY and used Actions minutes).
  # Icarus's cloud runtime now runs on Google Apps Script (icarus/athena-gas/). Files kept, not deleted.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icarus-aker-handoff
  cancel-in-progress: false

jobs:
  aker-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Validate required transition files
        run: |
          set -euo pipefail
          test -s icarus/aker.py
          test -s requirements.txt
          test -s .github/workflows/aker_loop.yml

      - name: Run Athena handoff module
        run: python3 icarus/aker.py

      - name: Verify output and refuse false completion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = Path('icarus/runs/aker_status.json')
          if not receipt.is_file():
              raise SystemExit('ATHENA FAILED: no status receipt')
          data = json.loads(receipt.read_text(encoding='utf-8'))
          print('ATHENA_RECEIPT_STATUS:', data.get('status', 'MISSING'))
          if data.get('status') == 'HANDOFF_READY':
              print('ATHENA HANDOFF ONLY: this does not verify autonomous task execution.')
          if data.get('status') not in {'HANDOFF_READY', 'BLOCKED', 'EXECUTING', 'VERIFYING', 'PASS', 'FAIL'}:
              raise SystemExit('ATHENA FAILED: unknown status')
          PY
