name: Icarus phone-only clasp deploy

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    if: ${{ github.event.issue.number == 55 && github.event.comment.body == 'ICARUS_CLASP_PHONE_DEPLOY_RUN' && github.event.comment.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified candidate
        uses: actions/checkout@v4
        with:
          ref: 2dab19008399570d31238cd62e885e163f2aa3a6
          persist-credentials: false

      - name: Install clasp and pexpect
        run: |
          npm install -g @google/clasp@3.2.0
          python -m pip install --quiet pexpect cryptography
          clasp --version

      - name: Headless owner auth and deploy verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: "55"
          SCRIPT_ID: "14k-ImKDntPPXhhFC7Wzj-2nMEbRIxNxNBDFRtRt03Q-5E5132k7r-wGL"
          DEPLOYMENT_ID: "AKfycbw7k-w7MVQt81U8vB3tJfLNsa3vvglvl1ANR2eIzsx2YJMJeifn5DrbnVWVy7rxocwJXw"
          BASE_CODE_SHA: "31254738eeb5f4537a0efffb16dd2adaa10bdf529bd4797038fc833203c94af1"
          BASE_RUNTIME_SHA: "d9049f33ed869329572acc2b713ccc8d32c42fab06a4af560f33e14e09a53f90"
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/icarus_oauth_private.pem >/dev/null 2>&1
          openssl rsa -pubout -in /tmp/icarus_oauth_private.pem -out /tmp/icarus_oauth_public.pem >/dev/null 2>&1
          python <<'PY'
          import os, re, time, json, base64, subprocess, pexpect, sys
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          repo=os.environ["REPO"]; issue=os.environ["ISSUE"]
          child=pexpect.spawn("clasp", ["login","--no-localhost","--user","icarus-phone"], encoding="utf-8", timeout=120)
          auth_url=None
          deadline=time.time()+120
          buf=""
          while time.time()<deadline and auth_url is None:
              try:
                  x=child.read_nonblocking(size=4096, timeout=5)
                  buf += x
                  m=re.search(r'https://accounts\.google\.com/[^\s]+', buf)
                  if m: auth_url=m.group(0)
              except pexpect.TIMEOUT:
                  pass
              except pexpect.EOF:
                  break
          if not auth_url:
              print("AUTH_URL_NOT_FOUND")
              print(buf[-2000:])
              sys.exit(2)
          pub=open("/tmp/icarus_oauth_public.pem","rb").read()
          pub64=base64.b64encode(pub).decode()
          body=(
              f"[ICARUS_CLASP_PHONE_AUTH]\\n"
              f"STATUS: OWNER_AUTH_REQUIRED\\n"
              f"RUN_ID: {os.environ.get('GITHUB_RUN_ID','')}\\n"
              f"AUTH_URL: {auth_url}\\n"
              f"PUBLIC_KEY_B64: {pub64}\\n"
              f"INSTRUCTION: Use the Teamchat phone OAuth relay page. It fetches this public key, encrypts the localhost callback locally in the browser, and outputs only ciphertext for this issue. Never send callback plaintext to ChatGPT or GitHub.\\n"
          )
          subprocess.run(["gh","api",f"repos/{repo}/issues/{issue}/comments","-f",f"body={body}"],check=True,stdout=subprocess.DEVNULL)
          marker=f"[ICARUS_CLASP_OAUTH_CIPHERTEXT:{os.environ.get('GITHUB_RUN_ID','')}]"
          encrypted=None
          for _ in range(180):
              out=subprocess.check_output(["gh","api",f"repos/{repo}/issues/{issue}/comments?per_page=100"],text=True)
              comments=json.loads(out)
              for c in reversed(comments):
                  b=c.get("body","")
                  if b.startswith(marker):
                      encrypted=b[len(marker):].strip()
                      break
              if encrypted: break
              time.sleep(5)
          if not encrypted:
              subprocess.run(["gh","api",f"repos/{repo}/issues/{issue}/comments","-f","body=[ICARUS_CLASP_PHONE_DEPLOY] STATUS: BLOCKED — encrypted OAuth callback not received before timeout."],check=True,stdout=subprocess.DEVNULL)
              sys.exit(3)
          parts=[p for p in encrypted.split(".") if p]
          if not parts:
              print("EMPTY_CIPHERTEXT")
              sys.exit(5)
          private_key=serialization.load_pem_private_key(open("/tmp/icarus_oauth_private.pem","rb").read(),password=None)
          callback_bytes=b""
          for part in parts:
              callback_bytes += private_key.decrypt(
                  base64.b64decode(part),
                  padding.OAEP(
                      mgf=padding.MGF1(algorithm=hashes.SHA256()),
                      algorithm=hashes.SHA256(),
                      label=None,
                  ),
              )
          callback=callback_bytes.decode("utf-8").strip()
          child.sendline(callback)
          child.expect(pexpect.EOF, timeout=120)
          rc=child.exitstatus
          if rc not in (0,None):
              print(child.before[-2000:])
              sys.exit(4)
          PY

          AUTH_JSON="$(clasp --user icarus-phone --json show-authorized-user)"
          echo "$AUTH_JSON" | jq -e '.email != null' >/dev/null

          mkdir -p /tmp/icarus-deploy
          cd /tmp/icarus-deploy
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json
          clasp --user icarus-phone pull

          CODE_FILE="$(find . -maxdepth 1 -type f \( -name 'Code.js' -o -name 'Code.gs' \) | head -1)"
          RUNTIME_FILE="$(find . -maxdepth 1 -type f \( -name 'Runtime.js' -o -name 'Runtime.gs' \) | head -1)"
          test -n "$CODE_FILE" && test -n "$RUNTIME_FILE"
          test "$(sha256sum "$CODE_FILE" | awk '{print $1}')" = "$BASE_CODE_SHA"
          test "$(sha256sum "$RUNTIME_FILE" | awk '{print $1}')" = "$BASE_RUNTIME_SHA"

          CAND_CODE_SRC="$GITHUB_WORKSPACE/drafts/icarus/2026-10-06-standalone-reasoning/candidate/Code.gs"
          CAND_RUNTIME_SRC="$GITHUB_WORKSPACE/drafts/icarus/2026-10-06-standalone-reasoning/candidate/Runtime.gs"
          CAND_CODE_SHA="$(sha256sum "$CAND_CODE_SRC" | awk '{print $1}')"
          CAND_RUNTIME_SHA="$(sha256sum "$CAND_RUNTIME_SRC" | awk '{print $1}')"
          grep -q "execution intentionally disabled" "$CAND_RUNTIME_SRC"
          ! grep -q "executeComposioTask_(taskId" "$CAND_RUNTIME_SRC"
          cp "$CAND_CODE_SRC" "$CODE_FILE"
          cp "$CAND_RUNTIME_SRC" "$RUNTIME_FILE"

          clasp --user icarus-phone show-file-status --json > /tmp/status-before-push.json
          clasp --user icarus-phone push --force
          BEFORE="$(clasp --user icarus-phone --json list-deployments)"
          clasp --user icarus-phone create-deployment --deploymentId "$DEPLOYMENT_ID" --description "Icarus Google reasoning-only restore"
          AFTER="$(clasp --user icarus-phone --json list-deployments)"
          echo "$AFTER" | jq -e --arg id "$DEPLOYMENT_ID" '.. | objects | select(.deploymentId? == $id)' >/dev/null

          rm -rf /tmp/icarus-readback
          mkdir /tmp/icarus-readback
          cd /tmp/icarus-readback
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json
          clasp --user icarus-phone pull
          CODE_RB="$(find . -maxdepth 1 -type f \( -name 'Code.js' -o -name 'Code.gs' \) | head -1)"
          RUNTIME_RB="$(find . -maxdepth 1 -type f \( -name 'Runtime.js' -o -name 'Runtime.gs' \) | head -1)"
          test "$(sha256sum "$CODE_RB" | awk '{print $1}')" = "$CAND_CODE_SHA"
          test "$(sha256sum "$RUNTIME_RB" | awk '{print $1}')" = "$CAND_RUNTIME_SHA"

          EMAIL="$(echo "$AUTH_JSON" | jq -r '.email')"
          BODY="$(printf '%s\\n' \
            '[ICARUS_CLASP_PHONE_DEPLOY]' \
            'STATUS: READY_FOR_OWNER_STANDALONE_CANARY' \
            "RUN_ID: $GITHUB_RUN_ID" \
            'EXECUTOR: GitHub-hosted repo worker via clasp 3.2.0' \
            "SCRIPT_ID: $SCRIPT_ID" \
            "DEPLOYMENT_ID: $DEPLOYMENT_ID" \
            "AUTHORIZED_USER: $EMAIL" \
            "CODE_SHA256: $CAND_CODE_SHA" \
            "RUNTIME_SHA256: $CAND_RUNTIME_SHA" \
            'SOURCE_READBACK: MATCH' \
            'ANDROID/PAIRING/SIGNING: UNTOUCHED' \
            'COST: €0' \
            'PASS: NOT CLAIMED — requires fresh standalone Redmi canary with laptop/Codex/ADB absent.')"
          gh api "repos/$REPO/issues/$ISSUE/comments" -f "body=$BODY" >/dev/null
