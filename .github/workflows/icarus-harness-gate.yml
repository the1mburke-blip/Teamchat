name: Icarus Harness Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  actions: read

concurrency:
  group: harness-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build harness image
        id: build
        run: |
          set -o pipefail
          docker build -t teamchat-harness:test . 2>&1 | tee build.log

      - name: Run harness
        id: harness
        run: |
          set -o pipefail
          python3 harness_runner.py 2>&1 | tee harness.log

      - name: Produce physical state readback manifest
        if: success()
        env:
          ICARUS_HARNESS_OUTCOME: ${{ steps.harness.outcome }}
          ICARUS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ICARUS_TASK_ID: PR-${{ github.event.pull_request.number || github.sha }}
        run: python3 harness-runner.py --write-ci-manifest COMPLETION_MANIFEST.json

      - name: Write RUN_LOG.jsonl
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          from datetime import datetime, timezone
          def read(name):
              p = pathlib.Path(name)
              return p.read_text(errors="replace") if p.exists() else ""
          log = read("harness.log")
          match = re.search(r"HARNESS (PASS|FAIL): exit code (-?\d+)", log)
          summary = re.findall(r"=+ (.*(?:passed|failed|error).*) =+", log)
          record = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"],
              "build_outcome": os.environ["BUILD_OUTCOME"],
              "harness_outcome": os.environ["HARNESS_OUTCOME"],
              "harness_status": match.group(1) if match else None,
              "harness_exit_code": int(match.group(2)) if match else None,
              "pytest_summary": summary[-1] if summary else None,
              "build_log_tail": read("build.log").splitlines()[-40:],
              "harness_log_tail": log.splitlines()[-80:],
          }
          pathlib.Path("RUN_LOG.jsonl").write_text(json.dumps(record) + "\n")
          print(json.dumps({key: record[key] for key in
              ("build_outcome", "harness_outcome", "harness_exit_code", "pytest_summary")}))
          PY

      - name: Upload physical run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-run-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            RUN_LOG.jsonl
            COMPLETION_MANIFEST.json
          if-no-files-found: error
          retention-days: 30

  completion-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce Completion Evidence Integrity
        env:
          ICARUS_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ICARUS_AUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 harness-runner.py --audit-state-writes
