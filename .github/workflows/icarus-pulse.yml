name: ICARUS Pulse & Operational Duty

on:
  schedule:
    - cron: '7 0-22/2 1-30 * *'  # Operational duty
    - cron: '7 1-23/2 1-30 * *'  # Heartbeat
    - cron: '7 * 31 * *'         # Heartbeat on day 31
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && format('harness-gate-{0}', github.ref) || 'icarus-issue-6-intake' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  icarus-pulse:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ICARUS_PULSE_DUTY_SCHEDULE: '7 0-22/2 1-30 * *'
    permissions:
      actions: write
      contents: read
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute ICARUS On-Duty Runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICARUS_ISSUE_NUMBER: "6"
          ICARUS_PULSE_TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 -m icarus.core.duty_runner

      - name: Check ICARUS Pulse inference partition
        id: pulse_quota
        if: github.event_name == 'schedule' && github.event.schedule == env.ICARUS_PULSE_DUTY_SCHEDULE
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m icarus.core.runtime --pulse-reserve

      - name: Persist ICARUS Pulse inference reservation
        id: pulse_reservation
        if: steps.pulse_quota.outputs.day != ''
        uses: actions/upload-artifact@v4
        with:
          name: icarus-pulse-quota-${{ steps.pulse_quota.outputs.day }}
          path: ${{ runner.temp }}/icarus-pulse-reservation.json
          if-no-files-found: error
          retention-days: 31

      - name: Execute ICARUS Pulse reasoning
        if: steps.pulse_reservation.outputs.artifact-id != ''
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMENT_ID: pulse-${{ github.run_id }}
          COMMENT_ACTOR: schedule
          PULSE_RESERVATION_ID: ${{ steps.pulse_reservation.outputs.artifact-id }}
        run: python3 -m icarus.core.runtime --pulse-infer

      - name: Persist Execution Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icarus-duty-ledger
          path: |
            icarus_status.json
            RUN_LOG.jsonl
            icarus-pilot-proof.bin
            icarus/runs/*-pulse-${{ github.run_id }}.md
          retention-days: 30

  sidecar-verifier:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && vars.ICARUS_SIDECAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: icarus-sidecar
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and submit exact-head review
        env:
          SIDECAR_VERIFIER_TOKEN: ${{ secrets.SIDECAR_VERIFIER_TOKEN }}
        run: python3 -m icarus.core.sidecar

  harness:
    name: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'harness' || 'harness (inactive)' }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build harness image
        id: build
        run: |
          set -o pipefail
          docker build -t teamchat-harness:test . 2>&1 | tee build.log

      - name: Run harness
        id: harness
        run: |
          set -o pipefail
          python3 -m icarus.harness.container 2>&1 | tee harness.log

      - name: Produce physical state readback manifest
        if: success()
        env:
          ICARUS_HARNESS_OUTCOME: ${{ steps.harness.outcome }}
          ICARUS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ICARUS_TASK_ID: PR-${{ github.event.pull_request.number || github.sha }}
        run: python3 -m icarus.harness.runner --write-ci-manifest COMPLETION_MANIFEST.json

      - name: Write RUN_LOG.jsonl
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HARNESS_OUTCOME: ${{ steps.harness.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          from datetime import datetime, timezone
          def read(name):
              p = pathlib.Path(name)
              return p.read_text(errors="replace") if p.exists() else ""
          log = read("harness.log")
          match = re.search(r"HARNESS (PASS|FAIL): exit code (-?\d+)", log)
          summary = re.findall(r"=+ (.*(?:passed|failed|error).*) =+", log)
          record = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"],
              "build_outcome": os.environ["BUILD_OUTCOME"],
              "harness_outcome": os.environ["HARNESS_OUTCOME"],
              "harness_status": match.group(1) if match else None,
              "harness_exit_code": int(match.group(2)) if match else None,
              "pytest_summary": summary[-1] if summary else None,
              "build_log_tail": read("build.log").splitlines()[-40:],
              "harness_log_tail": log.splitlines()[-80:],
          }
          pathlib.Path("RUN_LOG.jsonl").write_text(json.dumps(record) + "\n")
          print(json.dumps({key: record[key] for key in
              ("build_outcome", "harness_outcome", "harness_exit_code", "pytest_summary")}))
          PY

      - name: Upload physical run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-run-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            RUN_LOG.jsonl
            COMPLETION_MANIFEST.json
          if-no-files-found: error
          retention-days: 30

  completion-integrity:
    name: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'completion-integrity' || 'completion-integrity (inactive)' }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce Completion Evidence Integrity
        env:
          ICARUS_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ICARUS_AUDIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m icarus.harness.runner --audit-state-writes
