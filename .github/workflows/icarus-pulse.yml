name: ICARUS Pulse & Operational Duty

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: icarus-issue-6-intake
  cancel-in-progress: false

jobs:
  icarus-pulse:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute ICARUS On-Duty Runner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICARUS_ISSUE_NUMBER: "6"
        run: |
          python3 scripts/icarus_duty_runner.py

      - name: Dispatch Prime Snapshot Sync
        if: ${{ !cancelled() && github.run_attempt == 1 && hashFiles('RUN_LOG.jsonl') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run prime-snapshot-sync.yml --ref "$GITHUB_REF_NAME" \
            -f pulse_run_id="$GITHUB_RUN_ID" -f pulse_event="$GITHUB_EVENT_NAME" -f pulse_sha="$GITHUB_SHA"

      - name: Persist Execution Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icarus-duty-ledger
          path: |
            icarus_status.json
            RUN_LOG.jsonl
          retention-days: 30
