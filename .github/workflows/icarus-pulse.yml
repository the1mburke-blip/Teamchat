name: Codex bot wake transport canary
on: workflow_dispatch
permissions:
  pull-requests: write
  contents: read
jobs:
  signal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/pulse-bot-wake-canary'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Post one transport canary to PR 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf -v body '[ICARUS CODEX BOT WAKE CANARY]\nCanary Run ID: %s' "$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/8/comments" -f body="$body" --jq '{id, html_url, author: .user.login, actor: .user.id, created_at}'
