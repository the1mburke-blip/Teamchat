name: ICARUS Android Qwen source bridge ghost
on:
  push:
    branches: [feature/icarus-hermes-android-qwen-review-20261010]
    paths: [.github/workflows/icarus-hermes-android-qwen-review.yml]
permissions: {contents: read}
concurrency:
  group: icarus-hermes-android-qwen-review
  cancel-in-progress: false
jobs:
  qwen-android-lineage-review:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Checkout pinned standalone Kotlin Android donor
        uses: actions/checkout@v4
        with:
          repository: l3ad3r1/Hermes-Agent-Android
          ref: a08497b979d6241387bc15cde7c57279d0b2cc10
          path: donor
          persist-credentials: false
      - name: Verify real input and overlay compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qwen-android-evidence
          test "$(git -C donor rev-parse HEAD)" = "a08497b979d6241387bc15cde7c57279d0b2cc10"
          test "$(tr -d '\r\n' < donor/agent-core.ref)" = "8445f2a04d4f9ca48c7c8d12221ad33064dd1b45"
          python3 -m py_compile drafts/icarus/2026-10-08-hermes-shell/apply_icarus_overlay.py
          for x in identity.md inherited.md learned.md current-state.md; do
            test -s "drafts/icarus/2026-10-08-hermes-shell/lineage-source/$x"
            sha256sum "drafts/icarus/2026-10-08-hermes-shell/lineage-source/$x"
          done | tee qwen-android-evidence/lineage-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          root=Path('donor/app/src/main/kotlin/com/hermes/agent/data/agent')
          overlay=Path('drafts/icarus/2026-10-08-hermes-shell/apply_icarus_overlay.py').read_text()
          source=(root/'OrchestratorImpl.kt').read_text()
          runner=(root/'AgentLoopRunner.kt').read_text()
          checks={
            'stable_system_anchor':source.count('val stableSystem = persona + standingBlock + supplementalBlock + toolInstruction')==1,
            'deterministic_denial_anchor':source.count('decision is ToolExecutionDecision.Deny -> ToolResult.error(decision.reason)')==1,
            'agent_loop_anchor':runner.count('tools.none { it.name == call.name } -> ToolResult.error(')==1,
            'lineage_asset_copy':'app/src/main/assets/icarus/memory' in overlay,
            'app_id_change':'com.icarus.preproduction' in overlay,
          }
          (Path('qwen-android-evidence')/'anchor-checks.txt').write_text('\n'.join(f'{k}={v}' for k,v in checks.items())+'\n')
          print(checks)
          if not all(checks.values()): raise SystemExit('STAGED_OVERLAY_UPSTREAM_ANCHOR_DRIFT')
          PY
          echo "ANDROID_DONOR_SOURCE_VERIFIED=true" > qwen-android-evidence/worker-state.txt
          echo "TRAINING_REVIEW=HV-EXP-084; source-stage only, no self-PASS" >> qwen-android-evidence/worker-state.txt
          echo "COST_CAP=EUR0; NO_MODEL_API" >> qwen-android-evidence/worker-state.txt
      - name: Run local Qwen coder for one Android lineage-owner source candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet transformers accelerate safetensors
          cat > /tmp/qwen_mobile.py <<'PY'
          from pathlib import Path
          import torch
          from transformers import AutoTokenizer, AutoModelForCausalLM
          model_id='Qwen/Qwen2.5-Coder-1.5B-Instruct'
          tok=AutoTokenizer.from_pretrained(model_id)
          model=AutoModelForCausalLM.from_pretrained(model_id, torch_dtype=torch.float32, low_cpu_mem_usage=True)
          model.eval()
          prompt="""Return only Kotlin source for IcarusLineageStore.kt, package com.hermes.agent.data.agent.
          Define internal class IcarusLineageStore(private val context: android.content.Context).
          Expose fun load(): Map<String, String> that loads EXACTLY four nonempty UTF-8 files
          from context.assets: icarus/memory/identity.md, inherited.md, learned.md,
          current-state.md (all paths share icarus/memory prefix).
          Throw on missing, empty, or unreadable asset, never silently fall back to Hermes.
          Never use network, model prompt, preferences, plugins or writable files as source.
          Do not create a fake controller, gateway, PASS state, tools, permission or permit.
          This is a bounded immutable startup asset reader only, not hard governance.
          Output Kotlin source only, no Markdown."""
          rendered=tok.apply_chat_template([{'role':'user','content':prompt}],tokenize=False,add_generation_prompt=True)
          inputs=tok(rendered,return_tensors='pt')
          with torch.inference_mode():
            out=model.generate(**inputs,max_new_tokens=650,do_sample=False,pad_token_id=tok.eos_token_id)
          result=tok.decode(out[0][inputs['input_ids'].shape[1]:],skip_special_tokens=True).strip()
          fence=chr(96)*3
          if result.startswith(fence):
            result='\n'.join(result.splitlines()[1:])
            if result.rstrip().endswith(fence): result=result.rstrip()[:-3]
          p=Path('qwen-android-evidence')
          (p/'qwen-raw-output.txt').write_text(result+'\n')
          checks={'package':'package com.hermes.agent.data.agent' in result,
                  'class':'IcarusLineageStore' in result,
                  'assets':'assets' in result,
                  'four_names':all(x in result for x in ('identity.md','inherited.md','learned.md','current-state.md')),
                  'no_fake_pass':'TaskStage.PASS' not in result}
          (p/'model-checks.txt').write_text('\n'.join(f'{k}={v}' for k,v in checks.items())+'\n')
          print(checks)
          if not all(checks.values()): raise SystemExit('QWEN_CANDIDATE_STATIC_GATE_FAILED')
          (p/'IcarusLineageStore.kt').write_text(result+'\n')
          print('REAL_QWEN_CANDIDATE_GENERATED; NOT_COMPILED_OR_INTEGRATED')
          PY
          python3 /tmp/qwen_mobile.py
      - name: Preserve model output and source evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Icarus-Hermes-Android-Qwen-lineage-candidate
          path: qwen-android-evidence/
          retention-days: 7
          if-no-files-found: warn
