name: Icarus Repo Runtime Ghost

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: icarus-repo-runtime-ghost
  cancel-in-progress: false

jobs:
  runtime_smoke:
    if: >-
      github.event.issue.number == 49 &&
      github.event.issue.pull_request == null &&
      contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
      github.event.comment.body == 'ICARUS_REPO_RUNTIME_GHOST_RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Teamchat
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Refresh Android CLI and install compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --install "cmdline-tools;latest" >/dev/null || true
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: drafts/icarus/2026-10-05-lightweight-shell/compile-ready
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Run Icarus emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/icarus-runtime-smoke.sh

      - name: Upload runtime-tested APK and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: IcarusShell-runtime-verified
          path: runtime-evidence/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Persist runtime evidence
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const apk = 'runtime-evidence/IcarusShell-runtime-tested-debug.apk';
            const digest = crypto.createHash('sha256').update(fs.readFileSync(apk)).digest('hex');
            const path = 'drafts/icarus/2026-10-05-lightweight-shell/compile-ready/RUNTIME_EVIDENCE.md';
            const runUrl = 'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const body = [
              '# Icarus lightweight shell — runtime evidence',
              '',
              '- Executor: Repo Runtime Ghost (GitHub Actions)',
              '- Run: ' + context.runId,
              '- Emulator: Android API 34 x86_64 / Pixel 6 profile',
              '- Launch MainActivity: PASS',
              '- Voice toggle UI: PASS',
              '- Text input: PASS',
              '- Submit -> VERIFYING: PASS',
              '- Cancel -> IDLE: PASS',
              '- Fatal exception check: PASS',
              '- Artifact: IcarusShell-runtime-verified',
              '- Runtime-tested APK SHA-256: ' + digest,
              '- Run URL: ' + runUrl,
              '- Cost: €0',
              '- Boundary: emulator runtime verified; physical Redmi installation is not yet verified.'
            ].join('\n') + '\n';

            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'test: record Icarus emulator runtime evidence',
              content: Buffer.from(body, 'utf8').toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {})
            });

            await github.rest.issues.createComment({
              owner, repo, issue_number: 49,
              body: [
                '[REPO_RUNTIME_GHOST] ICARUS_EMULATOR_RUNTIME_VERIFIED',
                'STATUS: READY_FOR_OWNER_DEVICE_VERIFICATION',
                'RUN: ' + context.runId,
                'ARTIFACT: IcarusShell-runtime-verified',
                'APK_SHA256: ' + digest,
                'RUN_URL: ' + runUrl,
                'EVIDENCE_FILE: https://github.com/' + owner + '/' + repo + '/blob/main/' + path,
                'COST: €0',
                'BOUNDARY: Android emulator runtime PASS; physical Redmi install remains unverified.'
              ].join('\n')
            });
