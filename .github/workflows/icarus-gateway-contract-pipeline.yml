name: Icarus Gateway Contract Pipeline

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: icarus-gateway-contract-pipeline
  cancel-in-progress: false

jobs:
  deterministic_extract:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 50 &&
       github.event.issue.pull_request == null &&
       contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
       github.event.comment.body == 'ICARUS_GATEWAY_PIPELINE_RUN')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout full Teamchat history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract relevant issue evidence
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const {owner, repo} = context.repo;
            const outDir = path.join(process.env.GITHUB_WORKSPACE, 'gateway-evidence');
            fs.mkdirSync(outDir, {recursive:true});
            const needles = /(icarus|platform|broker|composio|task[_ -]?id|submit|advance|status|result|authorization|bearer|app.?check|workers\.dev|reasoning:\s*brokered)/i;
            const issueNums = [6,44,45,49,50];
            const rows = [];
            for (const issue_number of issueNums) {
              try {
                const issue = (await github.rest.issues.get({owner, repo, issue_number})).data;
                if (needles.test(issue.body || '') || needles.test(issue.title || '')) {
                  rows.push('===== ISSUE #' + issue_number + ' =====\n' + (issue.title||'') + '\n' + (issue.body||''));
                }
                const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page:100});
                for (const c of comments) {
                  if (needles.test(c.body || '')) {
                    rows.push('===== ISSUE #' + issue_number + ' COMMENT ' + c.id + ' =====\n' + (c.body||''));
                  }
                }
              } catch (e) {
                rows.push('ISSUE_READ_ERROR #' + issue_number + ': ' + e.message);
              }
            }
            fs.writeFileSync(path.join(outDir,'issue_hits.txt'), rows.join('\n\n') + '\n', 'utf8');

      - name: Extract current tree and historical contract evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gateway-evidence
          PATTERN='workers\.dev|https?://[^ ]+|/task|/submit|/status|/advance|task_id|taskId|Authorization|Bearer|AppCheck|App.?Check|Composio|Platform|REASONING:[[:space:]]*BROKERED|toolkit_connection_statuses|MANAGE_CONNECTIONS|SEARCH_TOOLS'

          {
            echo '===== CURRENT TREE HITS ====='
            grep -RniE --exclude-dir=.git --exclude='*.png' --exclude='*.apk' --exclude='*.zip' "$PATTERN"               icarus logs drafts .github 2>/dev/null | sort -u | head -n 1500 || true
          } > gateway-evidence/current_hits.txt

          : > gateway-evidence/history_hits.txt
          count=0
          while read -r commit; do
            count=$((count+1))
            {
              git grep -n -I -E "$PATTERN" "$commit" --                 'icarus/**' 'logs/**' 'drafts/icarus/**' '.github/**' 2>/dev/null || true
            } | sed "s#^#$commit #"
          done < <(git rev-list --all) | sort -u | head -n 4000 > gateway-evidence/history_hits.txt

          {
            echo '===== GIT -S DISCOVERY ====='
            for term in 'workers.dev' 'task_id' 'taskId' '/advance' '/submit' 'REASONING: BROKERED' 'toolkit_connection_statuses' 'MANAGE_CONNECTIONS' 'SEARCH_TOOLS'; do
              echo "--- TERM: $term ---"
              git log --all -S"$term" --oneline --decorate -n 60 || true
            done
          } > gateway-evidence/git_s_discovery.txt

          {
            echo '# Icarus gateway deterministic evidence'
            echo
            echo 'Generated by deterministic GitHub Actions extraction. No model inference in this file.'
            echo
            cat gateway-evidence/current_hits.txt
            echo
            echo '===== ISSUE HITS ====='
            cat gateway-evidence/issue_hits.txt
            echo
            echo '===== HISTORICAL HITS ====='
            cat gateway-evidence/history_hits.txt
            echo
            cat gateway-evidence/git_s_discovery.txt
          } > gateway-evidence/CONTRACT_RAW_EVIDENCE.md

      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v7
        with:
          name: icarus-gateway-contract-evidence
          path: gateway-evidence/
          if-no-files-found: error
          retention-days: 30

  bounded_classifier:
    needs: deterministic_extract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Teamchat
        uses: actions/checkout@v6

      - name: Download deterministic evidence
        uses: actions/download-artifact@v8
        with:
          name: icarus-gateway-contract-evidence
          path: gateway-evidence

      - name: Install local Qwen
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers accelerate safetensors sentencepiece

      - name: Classify extracted evidence only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/classify.py <<'PY'
          import pathlib, re, torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          raw = pathlib.Path('gateway-evidence/CONTRACT_RAW_EVIDENCE.md').read_text(encoding='utf-8', errors='replace')
          # Bounded evidence: prioritize exact endpoint/auth/request/response-looking lines.
          lines = raw.splitlines()
          priority = []
          seen = set()
          rx = re.compile(r'(https?://|workers\.dev|/task|/submit|/status|/advance|task_id|taskId|Authorization|Bearer|AppCheck|Composio|Platform|toolkit_connection_statuses|MANAGE_CONNECTIONS|SEARCH_TOOLS)', re.I)
          for line in lines:
              if rx.search(line):
                  key=line.strip()
                  if key and key not in seen:
                      seen.add(key)
                      priority.append(line)
              if len(priority) >= 260:
                  break
          evidence='\n'.join(priority)

          prompt=f"""
          You are a classifier, not a researcher. The deterministic runner already extracted candidate evidence.
          Decide whether the exact Android-to-existing-Icarus execution contract is physically present.

          Do not invent anything. A health endpoint is not a submit endpoint.
          If a field is not explicit in evidence, write MISSING.
          Output no prose beyond these seven lines:

          ENDPOINT: <exact task endpoint or MISSING>
          AUTH: <exact Android auth handoff or MISSING>
          SUBMIT_REQUEST: <exact request fields or MISSING>
          SUBMIT_RESPONSE: <exact response fields or MISSING>
          STATUS_RESULT: <exact status/result fields or MISSING>
          VERDICT: READY|BLOCKED
          FORWARD_PATH: <one sentence>

          EVIDENCE:
          {evidence[:18000]}
          """

          model_id='Qwen/Qwen2.5-Coder-1.5B-Instruct'
          tok=AutoTokenizer.from_pretrained(model_id)
          model=AutoModelForCausalLM.from_pretrained(model_id,dtype=torch.float32,low_cpu_mem_usage=True)
          model.eval()
          rendered=tok.apply_chat_template([{'role':'user','content':prompt}],tokenize=False,add_generation_prompt=True)
          inputs=tok(rendered,return_tensors='pt')
          with torch.inference_mode():
              out=model.generate(**inputs,max_new_tokens=260,do_sample=False,repetition_penalty=1.12,pad_token_id=tok.eos_token_id)
          generated=tok.decode(out[0][inputs['input_ids'].shape[1]:],skip_special_tokens=True).strip()
          pathlib.Path('gateway-evidence/QWEN_RAW_OUTPUT.txt').write_text(generated+'\n',encoding='utf-8')

          fields=['ENDPOINT','AUTH','SUBMIT_REQUEST','SUBMIT_RESPONSE','STATUS_RESULT','VERDICT','FORWARD_PATH']
          values={}
          for f in fields:
              m=re.search(r'^'+re.escape(f)+r':\s*(.*)$',generated,re.M)
              values[f]=m.group(1).strip() if m and m.group(1).strip() else ('BLOCKED' if f=='VERDICT' else 'MISSING')
          if any(values[f]=='MISSING' for f in ['ENDPOINT','AUTH','SUBMIT_REQUEST','SUBMIT_RESPONSE','STATUS_RESULT']):
              values['VERDICT']='BLOCKED'
          if values['VERDICT'] not in ('READY','BLOCKED'):
              values['VERDICT']='BLOCKED'
          report='\n'.join(f'{f}: {values[f]}' for f in fields)+'\n'
          pathlib.Path('gateway-evidence/CONTRACT_CLASSIFICATION.txt').write_text(report,encoding='utf-8')
          print(report)
          PY
          python /tmp/classify.py

      - name: Upload classifier evidence
        uses: actions/upload-artifact@v7
        with:
          name: icarus-gateway-classification
          path: gateway-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Persist both raw evidence and normalized classification
        shell: bash
        run: |
          set -euo pipefail
          DEST='drafts/icarus/2026-10-05-real-gateway-ghost'
          mkdir -p "$DEST"
          cp gateway-evidence/CONTRACT_RAW_EVIDENCE.md "$DEST/CONTRACT_RAW_EVIDENCE.md"
          cp gateway-evidence/QWEN_RAW_OUTPUT.txt "$DEST/QWEN_RAW_OUTPUT.txt"
          cp gateway-evidence/CONTRACT_CLASSIFICATION.txt "$DEST/CONTRACT_CLASSIFICATION.txt"
          git config user.name 'icarus-repo-ghost'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'No evidence change to commit.'
          else
            git commit -m 'ghost: persist deterministic Icarus gateway contract evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
