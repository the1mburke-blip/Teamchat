name: Icarus Repo Compile Ghost

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: icarus-repo-compile-ghost
  cancel-in-progress: false

jobs:
  compile_shell:
    if: >-
      github.event.issue.number == 49 &&
      github.event.issue.pull_request == null &&
      contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
      github.event.comment.body == 'ICARUS_REPO_COMPILE_GHOST_RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Teamchat
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Refresh Android CLI and install API 37
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --install "cmdline-tools;latest" >/dev/null || true
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Compile Icarus shell
        id: build
        working-directory: drafts/icarus/2026-10-05-lightweight-shell/compile-ready
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  IcarusShell-debug.apk" > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload compiled APK
        uses: actions/upload-artifact@v7
        with:
          name: IcarusShell-debug
          path: |
            drafts/icarus/2026-10-05-lightweight-shell/compile-ready/app/build/outputs/apk/debug/app-debug.apk
            drafts/icarus/2026-10-05-lightweight-shell/compile-ready/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Persist build evidence
        uses: actions/github-script@v8
        env:
          APK_SHA256: ${{ steps.build.outputs.sha256 }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const path = 'drafts/icarus/2026-10-05-lightweight-shell/compile-ready/BUILD_EVIDENCE.md';
            const runUrl = 'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const body = [
              '# Icarus lightweight shell — compile evidence',
              '',
              '- Executor: Repo Compile Ghost (GitHub Actions)',
              '- Run: ' + context.runId,
              '- Result: SUCCESS',
              '- Artifact: IcarusShell-debug',
              '- APK source path: app/build/outputs/apk/debug/app-debug.apk',
              '- SHA-256: ' + process.env.APK_SHA256,
              '- Run URL: ' + runUrl,
              '- Cost: €0',
              '- Boundary: compile/build verified only; APK not installed or runtime-tested on Michael’s phone.'
            ].join('\n') + '\n';

            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'build: record Icarus shell compile evidence',
              content: Buffer.from(body, 'utf8').toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {})
            });

            await github.rest.issues.createComment({
              owner, repo, issue_number: 49,
              body: [
                '[REPO_COMPILE_GHOST] ICARUS_SHELL_COMPILED',
                'STATUS: COMPILED_SAVED_PENDING_DEVICE_RUNTIME_VERIFICATION',
                'RUN: ' + context.runId,
                'ARTIFACT: IcarusShell-debug',
                'SHA256: ' + process.env.APK_SHA256,
                'RUN_URL: ' + runUrl,
                'EVIDENCE_FILE: https://github.com/' + owner + '/' + repo + '/blob/main/' + path,
                'COST: €0',
                'BOUNDARY: compile/build verified; not installed or runtime-tested on phone.'
              ].join('\n')
            });
