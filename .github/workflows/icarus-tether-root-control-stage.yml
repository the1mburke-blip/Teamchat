name: ICARUS Tether source-root instruction and memory staging

on:
  push:
    branches:
      - feature/icarus-dsh-tether-rebrand-20261010
    paths:
      - .github/workflows/icarus-tether-root-control-stage.yml

permissions:
  contents: write

concurrency:
  group: icarus-tether-root-control-stage-20261010
  cancel-in-progress: false

jobs:
  stage_root:
    name: Deterministic runner - stage ICARUS root and verify canonical copies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated rebranding branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Stage source-root AGENTS and byte-exact canonical memory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          base=Path("drafts/icarus/2026-10-10-dsh-tether-rebrand")
          source=base/"source"
          canonical=Path("icarus/memory")
          required=["identity.md","inherited.md","learned.md","current-state.md"]
          assert (source/"index.js").is_file(), "WRONG_SOURCE_ROOT"
          assert (source/"package.json").is_file(), "WRONG_SOURCE_ROOT"
          assert (source/"LICENSE").is_file(), "MISSING_UPSTREAM_LICENSE"
          assert (base/"SOURCE_AND_BRAND_MANIFEST.json").is_file(), "MISSING_PARENT_PROVENANCE"
          parent=json.loads((base/"SOURCE_AND_BRAND_MANIFEST.json").read_text())
          assert parent["upstream_commit"]=="a702cae7fcf90b5025bde47d7dbdcbcb3a7e9f1c"
          assert all((canonical/name).is_file() for name in required), "MISSING_CANONICAL_MEMORY"
          assert not (source/"AGENTS.md").exists(), "ROOT_AGENTS_ALREADY_EXISTS_STOP"
          target=source/"icarus"
          assert not target.exists(), "ICARUS_SUBTREE_ALREADY_EXISTS_STOP"
          memory=target/"memory"
          memory.mkdir(parents=True)
          sha=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          entries=[]
          for name in required:
              from_path=canonical/name
              to_path=memory/name
              shutil.copyfile(from_path,to_path)
              assert from_path.read_bytes()==to_path.read_bytes()
              entries.append({"path":str(to_path),"canonical":str(from_path),"sha256":sha(to_path)})
          agents="""# ICARUS — candidate DSH workspace-root instructions

          This is a **project-scope** AGENTS.md for the staged DSH Tether source checkout.
          It is discovered by the DSH agent-instructions plugin **only when this
          directory is an eligible active DSH workspace/root**; placing it in an app
          source tree does NOT install it on any Android or PC device or enable it
          in all DSH sessions. It is not a hard governance engine.

          ## Identity and control contract
          Icarus is the persistent agent identity and intended adjudication layer,
          not the underlying reasoning model. Every model, tool and delegated worker
          is an untrusted executor. No worker may self-award PASS, extend its own
          permissions, or override the ICARUS governance contract.

          Core operating contract: user query -> Icarus -> verified solution -> user.
          Default cost EUR 0. No paid API, trial, deployment, release, device write,
          authentication alteration, signing, credential use, or protected-system
          mutation without explicit owner authority and task preflight.

          ## Session startup
          Before task execution, read and use the canonical files in this checkout:
          - icarus/memory/identity.md
          - icarus/memory/inherited.md
          - icarus/memory/learned.md
          - icarus/memory/current-state.md

          The last file is a **historical snapshot**, not live host state.
          Do not infer current activation, access, model route, or task success
          from its prose. Verify active environment and permissions independently.

          Before each consequential action: inspect history, inspect the actual
          target and runtime, route to a real eligible executor, perform preflight,
          obey protected-system boundaries, and require externally sufficient
          evidence before declaring success. When evidence is missing, report failure
          or unverified status, never simulated execution.

          ## Enforcement boundary
          These instructions are guidance loaded into model context if the host
          actually discovers this file. They CANNOT enforce tool permissions,
          intercept calls, control all workspaces, make a model independent, or
          establish bypass-proof ICARUS authority. A separate deterministic policy,
          capability and output gateway must be implemented, deny-tested and
          deployed in the live execution path before any such claim is made.
          Do not claim this candidate is active without a fresh-session readback.
          """
          agents="\n".join(x[10:] if x.startswith("          ") else x for x in agents.splitlines()).lstrip()+"\n"
          (source/"AGENTS.md").write_text(agents,encoding="utf-8")
          manifest={
            "status":"SOURCE_ROOT_STAGED_NOT_RUNTIME_ENFORCED",
            "owner":"Michael",
            "executor":"GitHub Actions deterministic repo runner",
            "source_branch":"feature/icarus-dsh-tether-rebrand-20261010",
            "staged_source_root":str(source),
            "instructions":{"path":str(source/"AGENTS.md"),"sha256":sha(source/"AGENTS.md")},
            "canonical_memory":entries,
            "active_workspace_runtime_target":"<selected-DSH-workspace>/AGENTS.md",
            "user_global_runtime_target":"$DSH_HOME/AGENTS.md (defaults to ~/.dsh/AGENTS.md)",
            "actual_user_hardware_written":False,
            "actual_dsh_runtime_session_readback":"NOT_RUN",
            "deterministic_icarus_enforcement":"NOT_IMPLEMENTED_OR_TESTED",
            "parent_upstream_commit":parent["upstream_commit"],
            "preserved_upstream_licence_sha256":parent["license_sha256"],
            "integration_note":"DSH Tether source checkout root is NOT necessarily the DSH workspace root on a running device.",
            "next_gate":"Fresh DSH session must independently confirm it loaded AGENTS.md in real selected workspace; separately deny/bypass-test real deterministic policy gateway."
          }
          (target/"ROOT_STAGING_MANIFEST.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          # Reject any accidental runtime/code mutation: only five new data files + manifest.
          import subprocess
          changed=subprocess.check_output(["git","status","--porcelain","--untracked-files=all"],text=True).splitlines()
          expected={str(source/"AGENTS.md"),str(target/"ROOT_STAGING_MANIFEST.json")}
          expected.update(row["path"] for row in entries)
          observed={line[3:] for line in changed}
          assert observed==expected, f"UNEXPECTED_DIRTY_PATHS: {observed ^ expected}"
          config=json.loads((source/"app/src-tauri/tauri.conf.json").read_text())
          assert config["identifier"]=="cc.zexa.dshtether","ANDROID_PACKAGE_ID_CHANGED"
          assert sha(source/"LICENSE")==parent["license_sha256"],"LICENSE_CHANGED"
          print("ROOT_FILES_STAGED",len(entries)+2)
          print("SOURCE_ROOT",source)
          print("CANONICAL_HASHES_MATCH",all(sha(canonical/name)==sha(memory/name) for name in required))
          print("CHANGED_PATHS",json.dumps(sorted(observed)))
          PY
      - name: Commit ONLY root guidance and canonical memory on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/icarus/2026-10-10-dsh-tether-rebrand/source/AGENTS.md drafts/icarus/2026-10-10-dsh-tether-rebrand/source/icarus/
          git diff --cached --quiet && { echo "NO_CHANGES_TO_COMMIT"; exit 1; }
          git commit -m "stage: canonical ICARUS memory and candid workspace-root guidance"
          git push origin HEAD:feature/icarus-dsh-tether-rebrand-20261010
          git rev-parse HEAD
      - name: Publish deterministic staging manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icarus-tether-root-staging
          path: drafts/icarus/2026-10-10-dsh-tether-rebrand/source/icarus/ROOT_STAGING_MANIFEST.json
          if-no-files-found: ignore
          retention-days: 3

  deepseek_advisory:
    name: DeepSeek local ghost - review root loading and enforcement caveats
    needs: stage_root
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout source branch with committed root files
        uses: actions/checkout@v4
        with:
          ref: feature/icarus-dsh-tether-rebrand-20261010
          persist-credentials: false
      - name: Install local free-model runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers accelerate safetensors sentencepiece
      - name: Run genuine DeepSeek local model, read-only advisory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,torch
          from transformers import AutoModelForCausalLM,AutoTokenizer
          root=pathlib.Path("drafts/icarus/2026-10-10-dsh-tether-rebrand/source")
          manifest=json.loads((root/"icarus/ROOT_STAGING_MANIFEST.json").read_text())
          instructions=(root/"AGENTS.md").read_text()
          model="deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
          tok=AutoTokenizer.from_pretrained(model)
          mdl=AutoModelForCausalLM.from_pretrained(model,torch_dtype=torch.float32,low_cpu_mem_usage=True)
          mdl.eval()
          prompt=("You are a read-only DeepSeek coding ghost. Review this ICARUS DSH Tether staging manifest and root AGENTS.md. "
                  "List the top three unsafe assumptions and the exact evidence needed before anyone claims universal governance or real startup load. "
                  "Distinguish Tether source root, selected DSH workspace root, and user-global $DSH_HOME/AGENTS.md. "
                  "No files were deployed or executed by this task; no model or ghost may certify PASS. "
                  "Do not invent paths or statuses. Manifest: "+json.dumps(manifest)[:4500]+" AGENTS: "+instructions[:5000])
          chat=tok.apply_chat_template([{"role":"user","content":prompt}],tokenize=False,add_generation_prompt=True)
          inputs=tok(chat,return_tensors="pt")
          with torch.inference_mode():
              out=mdl.generate(**inputs,max_new_tokens=400,do_sample=False,pad_token_id=tok.eos_token_id)
          raw=tok.decode(out[0][inputs["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          if not raw:raise SystemExit("DEEPSEEK_EMPTY_ADVISORY")
          pathlib.Path("ICARUS_TETHER_ROOT_GHOST_ADVISORY.txt").write_text("MODEL: "+model+"\nSTATUS: ADVISORY_NOT_VERIFIED\n"+raw+"\n",encoding="utf-8")
          print("GHOST_EXECUTED model="+model+" output_chars="+str(len(raw)))
          PY
      - name: Preserve ghost review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icarus-tether-root-ghost-advisory
          path: ICARUS_TETHER_ROOT_GHOST_ADVISORY.txt
          if-no-files-found: ignore
          retention-days: 3
