name: Icarus Real Gateway Repo Ghost

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: icarus-real-gateway-repo-ghost
  cancel-in-progress: false

jobs:
  gateway_ghost:
    if: >-
      github.event.issue.number == 50 &&
      github.event.issue.pull_request == null &&
      contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
      github.event.comment.body == 'ICARUS_REPO_GATEWAY_GHOST_RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Teamchat
        uses: actions/checkout@v6

      - name: Build bounded evidence packet
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/gateway-context.txt
          : > "$OUT"

          for f in \
            logs/2026-10-05-icarus-phone-session-public-journal.md \
            icarus/architecture/cloudflare-broker-deployment.md \
            icarus/architecture/mobile-composio-auth.md \
            icarus/architecture/android-broker-auth.md \
            drafts/icarus/2026-10-05-lightweight-shell/compile-ready/app/src/main/java/com/icarus/shell/IcarusCore.kt
          do
            echo "===== $f =====" >> "$OUT"
            sed -n '1,260p' "$f" >> "$OUT"
            echo >> "$OUT"
          done

          echo "===== CURRENT REPO EXACT CONTRACT HITS =====" >> "$OUT"
          grep -RniE --exclude-dir=.git --exclude='*.png' --exclude='*.apk' \
            'workers\.dev|/task|/submit|/status|/advance|task_id|taskId|Authorization|Bearer|firebase|app.?check|Composio|Platform' \
            . 2>/dev/null | sort -u | head -n 350 >> "$OUT" || true

          echo "===== GIT HISTORY CONTRACT HITS =====" >> "$OUT"
          git log --all --oneline --decorate -n 120 >> "$OUT"
          for term in 'workers.dev' 'task_id' 'taskId' '/advance' 'REASONING: BROKERED' 'Platform'; do
            echo "--- git log -S $term ---" >> "$OUT"
            git log --all -S"$term" --oneline --decorate -n 30 >> "$OUT" || true
          done

      - name: Install local Qwen coding ghost
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers accelerate safetensors sentencepiece

      - name: Run repo ghost
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/run_gateway_ghost.py <<'PY'
          import pathlib, re, torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          context = pathlib.Path("/tmp/gateway-context.txt").read_text(encoding="utf-8", errors="replace")
          prompt = f"""
          You are a bounded repository contract-recovery ghost.

          GOAL
          Determine whether Teamchat contains the exact previously working Android -> Platform/broker
          contract needed to replace FakeExecutionGateway. Do not write code yet.

          RULES
          - Use ONLY the supplied repository/current-history evidence.
          - Do not invent endpoints, auth, JSON fields, or state transitions.
          - Do not repeat source paths.
          - Keep the entire answer under 450 words.
          - If any one of endpoint, auth, submit request, submit response, or result/status contract
            is absent, verdict is BLOCKED.
          - A health endpoint does not count as a submit endpoint.
          - Existing proof that the old app worked does not count as the contract unless the fields
            are physically shown.

          OUTPUT EXACTLY:
          VERDICT: READY|BLOCKED
          ENDPOINT: <exact value or MISSING>
          AUTH: <exact value or MISSING>
          SUBMIT_REQUEST: <exact fields or MISSING>
          SUBMIT_RESPONSE: <exact fields or MISSING>
          STATUS_RESULT: <exact fields or MISSING>
          EVIDENCE:
          - <maximum 5 unique repo/history facts>
          SHORTEST_FORWARD_PATH: <one bounded recovery action using existing assets>

          EVIDENCE PACKET:
          {context[-36000:]}
          """

          model_id="Qwen/Qwen2.5-Coder-1.5B-Instruct"
          tok=AutoTokenizer.from_pretrained(model_id)
          model=AutoModelForCausalLM.from_pretrained(model_id,dtype=torch.float32,low_cpu_mem_usage=True)
          model.eval()
          rendered=tok.apply_chat_template([{"role":"user","content":prompt}],tokenize=False,add_generation_prompt=True)
          inputs=tok(rendered,return_tensors="pt")
          with torch.inference_mode():
              out=model.generate(**inputs,max_new_tokens=650,do_sample=False,pad_token_id=tok.eos_token_id)
          new=out[0][inputs["input_ids"].shape[1]:]
          raw=tok.decode(new,skip_special_tokens=True).strip()
          if "</think>" in raw.lower():
              raw=re.split(r"</think>",raw,flags=re.I)[-1].strip()
          if not raw:
              raise SystemExit("Gateway ghost returned no output")
          pathlib.Path("/tmp/gateway-ghost-result.md").write_text(raw+"\n",encoding="utf-8")
          print(raw)
          PY
          python /tmp/run_gateway_ghost.py

      - name: Validate anti-fabrication verdict
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^VERDICT: (READY|BLOCKED)

      - name: Persist ghost output
        shell: bash
        run: |
          set -euo pipefail
          DEST="drafts/icarus/2026-10-05-real-gateway-ghost"
          mkdir -p "$DEST"
          cp /tmp/gateway-ghost-result.md "$DEST/GATEWAY_GHOST_RESULT.md"
          git config user.name "icarus-repo-ghost"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST/GATEWAY_GHOST_RESULT.md"
          git commit -m "ghost: investigate evidenced Icarus real gateway contract"
          git push origin HEAD:main

      - name: Report to issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs');
            const result=fs.readFileSync('/tmp/gateway-ghost-result.md','utf8').trim();
            const verdict=(result.match(/^VERDICT:\s*(IMPLEMENT|BLOCKED)/m)||[])[1] || 'UNKNOWN';
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:50,
              body:[
                '[REPO_GATEWAY_GHOST_RESULT]',
                'MODEL: Qwen/Qwen2.5-Coder-1.5B-Instruct',
                'HOST: GitHub public CPU runner',
                'COST: €0',
                'VERDICT: '+verdict,
                'ARTIFACT: drafts/icarus/2026-10-05-real-gateway-ghost/GATEWAY_GHOST_RESULT.md',
                'RUN: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                '',
                result.slice(0,9000)
              ].join('\n')
            });
 /tmp/gateway-ghost-result.md
          grep -q '^ENDPOINT:' /tmp/gateway-ghost-result.md
          grep -q '^AUTH:' /tmp/gateway-ghost-result.md
          grep -q '^SUBMIT_REQUEST:' /tmp/gateway-ghost-result.md
          grep -q '^SUBMIT_RESPONSE:' /tmp/gateway-ghost-result.md
          grep -q '^STATUS_RESULT:' /tmp/gateway-ghost-result.md
          grep -q '^SHORTEST_FORWARD_PATH:' /tmp/gateway-ghost-result.md

      - name: Persist ghost output
        shell: bash
        run: |
          set -euo pipefail
          DEST="drafts/icarus/2026-10-05-real-gateway-ghost"
          mkdir -p "$DEST"
          cp /tmp/gateway-ghost-result.md "$DEST/GATEWAY_GHOST_RESULT.md"
          git config user.name "icarus-repo-ghost"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST/GATEWAY_GHOST_RESULT.md"
          git commit -m "ghost: investigate evidenced Icarus real gateway contract"
          git push origin HEAD:main

      - name: Report to issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs');
            const result=fs.readFileSync('/tmp/gateway-ghost-result.md','utf8').trim();
            const verdict=(result.match(/^VERDICT:\s*(IMPLEMENT|BLOCKED)/m)||[])[1] || 'UNKNOWN';
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:50,
              body:[
                '[REPO_GATEWAY_GHOST_RESULT]',
                'MODEL: Qwen/Qwen2.5-Coder-1.5B-Instruct',
                'HOST: GitHub public CPU runner',
                'COST: €0',
                'VERDICT: '+verdict,
                'ARTIFACT: drafts/icarus/2026-10-05-real-gateway-ghost/GATEWAY_GHOST_RESULT.md',
                'RUN: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                '',
                result.slice(0,9000)
              ].join('\n')
            });
