name: Icarus Real Gateway Repo Ghost

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: icarus-real-gateway-repo-ghost
  cancel-in-progress: false

jobs:
  gateway_ghost:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 50 &&
       github.event.issue.pull_request == null &&
       contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
       github.event.comment.body == 'ICARUS_REPO_GATEWAY_GHOST_RUN')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Teamchat
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build bounded evidence packet
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/gateway-context.txt
          : > "$OUT"
          for f in \
            logs/2026-10-05-icarus-phone-session-public-journal.md \
            icarus/architecture/cloudflare-broker-deployment.md \
            icarus/architecture/mobile-composio-auth.md \
            icarus/architecture/android-broker-auth.md \
            icarus/architecture/android-composio-oauth.md \
            icarus/architecture/android-task-durability.md \
            drafts/icarus/2026-10-05-lightweight-shell/compile-ready/app/src/main/java/com/icarus/shell/IcarusCore.kt
          do
            if [ -f "$f" ]; then
              echo "===== $f =====" >> "$OUT"
              sed -n '1,220p' "$f" >> "$OUT"
              echo >> "$OUT"
            fi
          done

          echo "===== UNIQUE CONTRACT HITS =====" >> "$OUT"
          grep -RniE --exclude-dir=.git --exclude='*.png' --exclude='*.apk' \
            'workers\.dev|/task|/submit|/status|/advance|task_id|taskId|Authorization|Bearer|AppCheck|App.?Check|Composio|Platform' \
            icarus logs drafts/icarus 2>/dev/null | sort -u | head -n 180 >> "$OUT" || true

      - name: Install local Qwen coding ghost
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers accelerate safetensors sentencepiece

      - name: Run contract recovery ghost
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/run_gateway_ghost.py <<'PY'
          import pathlib, re, torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          context = pathlib.Path('/tmp/gateway-context.txt').read_text(encoding='utf-8', errors='replace')
          prompt = f'''
          You are a bounded repository contract-recovery ghost.

          GOAL
          Determine whether the supplied repository evidence physically contains the exact Android -> existing Icarus Platform/broker contract needed to replace FakeExecutionGateway.

          RULES
          - Use ONLY supplied evidence.
          - Do not invent endpoint, auth, request/response fields, or state transitions.
          - A health endpoint is not a task-submit endpoint.
          - Existing proof that the old phone route worked is not enough unless the exact contract is shown.
          - If any required contract element is absent, return BLOCKED.
          - Keep the answer under 350 words.
          - Do not list the same source more than once.

          OUTPUT EXACTLY THESE TOP-LEVEL FIELDS:
          VERDICT: READY|BLOCKED
          ENDPOINT: <exact evidenced value or MISSING>
          AUTH: <exact evidenced handoff or MISSING>
          SUBMIT_REQUEST: <exact evidenced fields or MISSING>
          SUBMIT_RESPONSE: <exact evidenced fields or MISSING>
          STATUS_RESULT: <exact evidenced fields or MISSING>
          EVIDENCE:
          - <maximum 5 concise unique facts>
          SHORTEST_FORWARD_PATH: <one bounded next action using existing assets only>

          EVIDENCE PACKET:
          {context[-30000:]}
          '''

          model_id='Qwen/Qwen2.5-Coder-1.5B-Instruct'
          tok=AutoTokenizer.from_pretrained(model_id)
          model=AutoModelForCausalLM.from_pretrained(model_id,dtype=torch.float32,low_cpu_mem_usage=True)
          model.eval()
          rendered=tok.apply_chat_template([{'role':'user','content':prompt}],tokenize=False,add_generation_prompt=True)
          inputs=tok(rendered,return_tensors='pt')
          with torch.inference_mode():
              out=model.generate(**inputs,max_new_tokens=520,do_sample=False,repetition_penalty=1.04,pad_token_id=tok.eos_token_id)
          new=out[0][inputs['input_ids'].shape[1]:]
          raw=tok.decode(new,skip_special_tokens=True).strip()
          if '</think>' in raw.lower():
              raw=re.split(r'</think>',raw,flags=re.I)[-1].strip()
          if not raw:
              raise SystemExit('Gateway ghost returned no output')
          pathlib.Path('/tmp/gateway-ghost-result.md').write_text(raw+'\n',encoding='utf-8')
          print(raw)
          PY
          python /tmp/run_gateway_ghost.py

      - name: Validate exact output contract
        shell: bash
        run: |
          set -euo pipefail
          f=/tmp/gateway-ghost-result.md
          grep -Eq '^VERDICT: (READY|BLOCKED)$' "$f"
          grep -q '^ENDPOINT:' "$f"
          grep -q '^AUTH:' "$f"
          grep -q '^SUBMIT_REQUEST:' "$f"
          grep -q '^SUBMIT_RESPONSE:' "$f"
          grep -q '^STATUS_RESULT:' "$f"
          grep -q '^EVIDENCE:$' "$f"
          grep -q '^SHORTEST_FORWARD_PATH:' "$f"

      - name: Persist recovery result
        shell: bash
        run: |
          set -euo pipefail
          DEST='drafts/icarus/2026-10-05-real-gateway-ghost'
          mkdir -p "$DEST"
          cp /tmp/gateway-ghost-result.md "$DEST/GATEWAY_GHOST_RESULT.md"
          git config user.name 'icarus-repo-ghost'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST/GATEWAY_GHOST_RESULT.md"
          if git diff --cached --quiet; then
            echo 'No content change to commit.'
          else
            git commit -m 'ghost: persist Icarus real gateway contract recovery'
            git push origin HEAD:main
          fi

      - name: Report recovery result to issue 50
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs');
            const result=fs.readFileSync('/tmp/gateway-ghost-result.md','utf8').trim();
            const verdict=(result.match(/^VERDICT:\s*(READY|BLOCKED)$/m)||[])[1] || 'UNKNOWN';
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:50,
              body:[
                '[REPO_GATEWAY_GHOST_RESULT]',
                'MODEL: Qwen/Qwen2.5-Coder-1.5B-Instruct',
                'HOST: GitHub public CPU runner',
                'COST: €0',
                'VERDICT: '+verdict,
                'ARTIFACT: drafts/icarus/2026-10-05-real-gateway-ghost/GATEWAY_GHOST_RESULT.md',
                'RUN: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                '',
                result.slice(0,9000)
              ].join('\n')
            });
