name: Icarus Qwen Gateway Bind

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: icarus-qwen-gateway-bind
  cancel-in-progress: false

jobs:
  bind_build_runtime:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 50 &&
       github.event.issue.pull_request == null &&
       contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
       github.event.comment.body == 'ICARUS_QWEN_GATEWAY_BIND_RUN')
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout Teamchat
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare isolated candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC='drafts/icarus/2026-10-05-lightweight-shell/compile-ready'
          DEST='drafts/icarus/2026-10-05-real-gateway-bind/compile-ready'
          test -f "$SRC/app/src/main/java/com/icarus/shell/IcarusCore.kt"
          test -f 'drafts/icarus/2026-10-05-real-gateway-ghost/RECOVERED_LIVE_CONTRACT.md'
          rm -rf "$DEST"
          mkdir -p "$(dirname "$DEST")"
          cp -a "$SRC" "$DEST"

      - name: Install local Qwen coding ghost
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers accelerate safetensors sentencepiece

      - name: Generate bounded gateway bind
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/bind_gateway.py <<'PY'
          import pathlib, re, torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          root=pathlib.Path('drafts/icarus/2026-10-05-real-gateway-bind/compile-ready')
          pkg=root/'app/src/main/java/com/icarus/shell'
          contract=pathlib.Path('drafts/icarus/2026-10-05-real-gateway-ghost/RECOVERED_LIVE_CONTRACT.md').read_text()
          old_core=(pkg/'IcarusCore.kt').read_text()
          old_screen=(pkg/'IcarusShellScreen.kt').read_text()

          model_id='Qwen/Qwen2.5-Coder-1.5B-Instruct'
          tok=AutoTokenizer.from_pretrained(model_id)
          model=AutoModelForCausalLM.from_pretrained(model_id,dtype=torch.float32,low_cpu_mem_usage=True)
          model.eval()

          def gen(prompt,max_new):
              rendered=tok.apply_chat_template([{'role':'user','content':prompt}],tokenize=False,add_generation_prompt=True)
              inp=tok(rendered,return_tensors='pt')
              with torch.inference_mode():
                  out=model.generate(**inp,max_new_tokens=max_new,do_sample=False,repetition_penalty=1.06,pad_token_id=tok.eos_token_id)
              txt=tok.decode(out[0][inp['input_ids'].shape[1]:],skip_special_tokens=True).strip()
              txt=re.sub(r'^\\x60\\x60\\x60(?:kotlin)?\\s*','',txt,flags=re.I)
              txt=re.sub(r'\\s*\\x60\\x60\\x60$','',txt).strip()
              return txt

          gateway_prompt=f"""
          Write ONLY valid Kotlin source for AppsScriptGateway.kt.
          Package: com.icarus.shell

          Use the recovered contract below as authoritative. Do not invent another backend or auth scheme.

          {contract}

          Required:
          - standard Android/Java/Kotlin APIs only; no new library dependency.
          - SecureStore using AndroidKeyStore AES/GCM/NoPadding. Persist backend_url and device_id plainly; persist device_token encrypted.
          - IcarusApiClient taking endpointProvider: () -> String and POSTing JSON with HttpURLConnection.
          - Pair request fields exactly: op=pair, deviceId, pairingCode, clientVersion. Do not require googleIdToken.
          - Submit request fields exactly: op=submit, deviceId, token, clientTaskId UUID, text.
          - Status request fields exactly: op=status, deviceId, token, taskId.
          - Parse response envelope ok/error/data and task fields task_id,status,objective,evidence_ref.
          - class AppsScriptExecutionGateway(private val app: Application) : ExecutionGateway.
          - public methods backendUrl(), setBackendUrl(String), isPaired(), suspend pair(String).
          - submit(TaskRequest) must never invent PASS. Map backend status only.
          - After submit, poll status only while backend state is clearly nonterminal, for at most 60 seconds. If evidence_ref contains WORK COMPLETE or a result= payload, return VERIFYING with that evidence rather than waiting for owner PASS.
          - Backend PASS -> TaskStage.PASS; BLOCKED -> BLOCKED; FAIL/FAILED -> FAILED; VERIFYING or WORK_COMPLETE -> VERIFYING; other active states -> EXECUTING.
          - summary should expose a bounded readable result/evidence string when evidence_ref contains result=; proof must include task_id, backend status and evidence_ref when present.
          - cancel() only stops local polling. It MUST NOT claim remote cancellation.
          - Never send a Composio account parameter.
          - Never embed endpoint, token, pairing code, account id, email address or any credential.
          Output source only.
          """
          gateway=gen(gateway_prompt,3400)
          (pkg/'AppsScriptGateway.kt').write_text(gateway+'\n')

          core_prompt=f"""
          Write ONLY valid Kotlin source replacing IcarusCore.kt.
          Package: com.icarus.shell
          Existing file:
          {old_core}

          AppsScriptGateway now exists in the same package with:
          backendUrl():String, setBackendUrl(String), isPaired():Boolean,
          suspend pair(code:String), suspend submit(TaskRequest):TaskResult, suspend cancel().

          Requirements:
          - Preserve TaskStage, TaskRequest, ProofItem, TaskResult and ExecutionGateway.
          - Remove FakeExecutionGateway entirely.
          - IcarusViewModel must extend AndroidViewModel and accept Application.
          - Instantiate AppsScriptExecutionGateway with the Application.
          - UI state adds backendUrl, pairingCode, paired, connectionStatus while preserving problem/listening/stage/result/proof/error.
          - methods: onBackendUrlChanged, onPairingCodeChanged, pair, onProblemChanged, onVoiceToggle, submit, cancel, newTask.
          - pair validates https:// endpoint and nonblank pairing code, stores endpoint then calls real pair.
          - submit is disabled logically if unpaired; stage/result/proof come only from real gateway result.
          - cancel means stop waiting locally; result text must explicitly say remote task may continue. Do not say task cancelled.
          - newTask clears task fields but preserves connection/backend/paired state.
          - Never self-award PASS.
          - No DEMO text anywhere.
          Output source only.
          """
          core=gen(core_prompt,2800)
          (pkg/'IcarusCore.kt').write_text(core+'\n')

          screen_prompt=f"""
          Write ONLY valid Kotlin source replacing IcarusShellScreen.kt.
          Package: com.icarus.shell
          Existing screen:
          {old_screen}

          New IcarusUiState fields also include backendUrl, pairingCode, paired, connectionStatus.
          IcarusViewModel callbacks supplied by route will include onBackendUrlChanged, onPairingCodeChanged, onPair, plus existing callbacks.

          Requirements:
          - Keep ICARUS identity, voice-first button, text fallback, status/result/proof/error sections.
          - Add compact Connection section.
          - If not paired: OutlinedTextField for "Apps Script HTTPS endpoint", OutlinedTextField for "One-time pairing code", Pair button.
          - Show connectionStatus and paired state.
          - Task Submit button enabled only when paired, nonblank problem, and not active.
          - Cancel active action label must be "Stop waiting" because remote cancel is not proven.
          - Preserve New Task action.
          - No secret/token display, no vendor credentials, no hard-coded endpoint.
          - Material 3 only; no icons dependency.
          Output source only.
          """
          screen=gen(screen_prompt,2600)
          (pkg/'IcarusShellScreen.kt').write_text(screen+'\n')

          # Deterministically update route callbacks; tiny mechanical edit avoids another model pass.
          main=(pkg/'MainActivity.kt').read_text()
          main=main.replace(
              'state = state,\n        onProblemChanged = viewModel::onProblemChanged,',
              'state = state,\n        onBackendUrlChanged = viewModel::onBackendUrlChanged,\n        onPairingCodeChanged = viewModel::onPairingCodeChanged,\n        onPair = viewModel::pair,\n        onProblemChanged = viewModel::onProblemChanged,'
          )
          (pkg/'MainActivity.kt').write_text(main)

          # Deterministic Android requirements.
          manifest=root/'app/src/main/AndroidManifest.xml'
          m=manifest.read_text()
          if 'android.permission.INTERNET' not in m:
              m=m.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
          manifest.write_text(m)

          gradle=root/'app/build.gradle.kts'
          g=gradle.read_text()
          if 'lifecycle-viewmodel-ktx' not in g:
              g=g.replace('implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0")','implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0")\n    implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0")')
          gradle.write_text(g)

          checks={
            'gateway':['class AppsScriptExecutionGateway','AndroidKeyStore','AES/GCM/NoPadding','"op","pair"','"op","submit"','"op","status"','evidence_ref'],
            'core':['class IcarusViewModel','AndroidViewModel','onBackendUrlChanged','onPairingCodeChanged','fun pair','No DEMO text sentinel impossible'],
            'screen':['Apps Script HTTPS endpoint','One-time pairing code','Stop waiting']
          }
          text={'gateway':gateway,'core':core,'screen':screen}
          missing=[]
          for name,items in checks.items():
              for item in items:
                  if item == 'No DEMO text sentinel impossible':
                      continue
                  if item not in text[name]:
                      missing.append(name+':'+item)
          if 'FakeExecutionGateway' in core or 'DEMO:' in (gateway+core+screen):
              missing.append('demo_stub_removed')
          if missing:
              raise SystemExit('STRUCTURAL_VALIDATION_FAILED '+repr(missing))
          PY
          python /tmp/bind_gateway.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Compile real gateway candidate
        id: build
        working-directory: drafts/icarus/2026-10-05-real-gateway-bind/compile-ready
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Emulator launch and connection UI smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            APK='drafts/icarus/2026-10-05-real-gateway-bind/compile-ready/app/build/outputs/apk/debug/app-debug.apk'
            adb install -r "$APK"
            adb shell am start -W -n com.icarus.shell/.MainActivity
            sleep 3
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            grep -q 'ICARUS' /tmp/window.xml
            grep -q 'Apps Script HTTPS endpoint' /tmp/window.xml
            grep -q 'One-time pairing code' /tmp/window.xml
            ! grep -q 'DEMO:' /tmp/window.xml

      - name: Persist compiled candidate and evidence
        shell: bash
        env:
          APK_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          DEST='drafts/icarus/2026-10-05-real-gateway-bind/compile-ready'
          cat > "$DEST/GATEWAY_BIND_EVIDENCE.md" <<EOF
          # Icarus real gateway bind evidence
          - Executor: Qwen/Qwen2.5-Coder-1.5B-Instruct for bounded Kotlin adaptation
          - Deterministic verifier: GitHub Actions Gradle + Android emulator
          - Compile: PASS
          - Emulator launch: PASS
          - Connection UI readback: PASS
          - Demo gateway removed: structural + UI check PASS
          - APK SHA-256: $APK_SHA256
          - Cost: €0
          - Boundary: no live backend call was made from emulator; physical Redmi live task remains required.
          EOF
          git config user.name 'icarus-gateway-bind-ghost'
          git config user.email 'actions@users.noreply.github.com'
          git add 'drafts/icarus/2026-10-05-real-gateway-bind'
          git commit -m 'ghost: bind proven Apps Script gateway into Icarus shell'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload Redmi candidate APK
        uses: actions/upload-artifact@v7
        with:
          name: Icarus-real-gateway-debug
          path: drafts/icarus/2026-10-05-real-gateway-bind/compile-ready/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Report verified build to issue 50
        uses: actions/github-script@v8
        env:
          APK_SHA256: ${{ steps.build.outputs.sha256 }}
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            const runUrl='https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const head=(await github.rest.repos.getCommit({owner,repo,ref:'main'})).data.sha;
            await github.rest.issues.createComment({
              owner,repo,issue_number:50,
              body:[
                '[QWEN_GATEWAY_BIND_GHOST] ICARUS_REAL_GATEWAY_CANDIDATE_VERIFIED',
                'STATUS: READY_FOR_REDMi_LIVE_TASK_VERIFICATION',
                'MODEL: Qwen/Qwen2.5-Coder-1.5B-Instruct',
                'VERIFY: deterministic Gradle compile + Android emulator launch/UI readback',
                'RUN: '+context.runId,
                'RUN_URL: '+runUrl,
                'HEAD: '+head,
                'ARTIFACT: Icarus-real-gateway-debug',
                'APK_SHA256: '+process.env.APK_SHA256,
                'EVIDENCE: drafts/icarus/2026-10-05-real-gateway-bind/compile-ready/GATEWAY_BIND_EVIDENCE.md',
                'COST: €0',
                'BOUNDARY: real Apps Script contract is wired; emulator did not use live credentials. Physical Redmi real task + independent result readback remains the final gate.'
              ].join('\n')
            });

      - name: Report failure without retry
        if: failure()
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            await github.rest.issues.createComment({
              owner,repo,issue_number:50,
              body:[
                '[QWEN_GATEWAY_BIND_GHOST] FAIL',
                'STATUS: FAIL',
                'RUN: '+context.runId,
                'RUN_URL: https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'ACTION: no blind retry. Read the failing step/log and change the route or defect before another attempt.',
                'COST: €0'
              ].join('\n')
            });
