name: Icarus Cloud Daemon

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Process managed GOAL.md tasks or one explicit task'
        type: choice
        options:
          - goals
          - task
        default: goals
        required: true
      max_tasks:
        description: 'Maximum verified tasks this run (1-100)'
        default: '20'
        required: true
      target_file:
        description: 'Target file path'
        required: false
      instruction:
        description: 'Task instruction'
        required: false
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: icarus-main
  cancel-in-progress: false

jobs:
  execute-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Execute Task via CordisKernel
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TARGET_FILE: ${{ github.event.inputs.target_file }}
          INSTRUCTION: ${{ github.event.inputs.instruction }}
          MODE: ${{ github.event.inputs.mode || 'goals' }}
          MAX_TASKS: ${{ github.event.inputs.max_tasks || '20' }}
        run: |
          python -m dsh.completion --owner cloud --mode "$MODE" \
            --max-tasks "$MAX_TASKS" --target-file "$TARGET_FILE" --instruction "$INSTRUCTION"
