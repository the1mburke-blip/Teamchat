name: Icarus Runtime v0

# Wake Icarus off the laptop: the repo OWNER comments `ICARUS_RUN <task>` on any issue (not a PR).
# Optional lines in the comment: `MODEL: <gemini model id>`, `VERIFY_FILE: <repo path>`, `VERIFY_URL: <https url>`.
# Cost: EUR 0 (free Actions minutes + Gemini free tier). Bot replies do not match, so no loop.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: icarus-runtime
  cancel-in-progress: false

jobs:
  run:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'ICARUS_RUN')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Teamchat (memory is read from main)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Icarus
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
        run: python3 icarus/runtime/icarus_run.py

      - name: Save receipt (append-only new file)
        if: always()
        run: |
          git config user.name "icarus-runtime"
          git config user.email "icarus-runtime@users.noreply.github.com"
          git add icarus/runs
          git diff --cached --quiet || git commit -m "chore(icarus): run receipt ${{ github.event.comment.id }}"
          git pull --rebase --quiet origin main || true
          git push origin HEAD:main || echo "receipt push failed"

      - name: Reply with receipt
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let body = 'ICARUS RUNTIME: no receipt produced (runner failed before output).';
            try { body = fs.readFileSync('/tmp/icarus-reply.md', 'utf8'); } catch (e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
