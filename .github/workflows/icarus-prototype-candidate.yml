name: Icarus isolated prototype validation
on:
  push:
    branches: ['codex/icarus-prototype-20261006', 'codex/icarus-google-bundle-20261007', 'codex/icarus-governance-kernel-v1-20261007', 'codex/icarus-hermes-skills-v01-20261007', 'groq/icarus-hermes-mobile-foundation-v01-20261007']
    paths:
      - 'drafts/icarus/2026-10-06-prototype/**'
      - '.github/workflows/icarus-prototype-candidate.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deterministic server integration tests
        run: |
          node drafts/icarus/2026-10-06-prototype/tests/runtime.test.cjs
          node drafts/icarus/2026-10-06-prototype/tests/google-plugin.test.cjs
          node drafts/icarus/2026-10-06-prototype/tests/google-bundle.test.cjs
          node drafts/icarus/2026-10-06-prototype/tests/governance.test.cjs
          node drafts/icarus/2026-10-06-prototype/tests/skills.test.cjs
          node drafts/icarus/2026-10-06-prototype/tests/hermes-foundation.test.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-read-only: true
      - name: Existing stable SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile installable debug APK
        run: |
          set -euo pipefail
          mkdir -p out
          (cd drafts/icarus/2026-10-06-prototype/android && gradle --no-daemon :app:assembleDebug) | tee out/build.log
          cp drafts/icarus/2026-10-06-prototype/android/app/build/outputs/apk/debug/app-debug.apk out/Icarus-Hermes-Mobile-debug-installable.apk
          sha256sum out/Icarus-Hermes-Mobile-debug-installable.apk > out/apk.sha256
          git rev-parse HEAD > out/source-commit.txt
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK/build-tools/36.0.0/aapt2" dump badging out/Icarus-Hermes-Mobile-debug-installable.apk > out/apk-badging.txt
          grep -q "package: name='com.aistudio.icarus.appsscript'" out/apk-badging.txt
          "$SDK/build-tools/36.0.0/apksigner" verify --print-certs out/Icarus-Hermes-Mobile-debug-installable.apk > out/apk-signing.txt
          grep -q "Signer #1 certificate DN" out/apk-signing.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Icarus-Hermes-Mobile-DEBUG-installable
          path: out/
          if-no-files-found: error
          retention-days: 1