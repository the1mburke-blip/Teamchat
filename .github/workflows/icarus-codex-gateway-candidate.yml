name: Icarus Codex Gateway Candidate Build

on:
  push:
    branches: ['codex/icarus-real-gateway-bind-20261005']
    paths:
      - 'drafts/icarus/2026-10-05-codex-gateway-bind/**'
      - '.github/workflows/icarus-codex-gateway-candidate.yml'

permissions:
  contents: read

concurrency:
  group: icarus-codex-gateway-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compile_emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CANDIDATE: drafts/icarus/2026-10-05-codex-gateway-bind/compile-ready
    steps:
      - uses: actions/checkout@v6
      - name: Initialize raw evidence
        run: |
          mkdir -p candidate-evidence
          git rev-parse HEAD > candidate-evidence/source-commit.txt
          date -u +%FT%TZ > candidate-evidence/start-utc.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Install proven compile SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --install "cmdline-tools;latest" >/dev/null || true
          if [ -d "$SDK/cmdline-tools/latest-2" ]; then
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/latest-2" "$SDK/cmdline-tools/latest"
          fi
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"
      - name: Compile saved candidate
        shell: bash
        run: |
          set -euo pipefail
          (cd "$CANDIDATE" && gradle --no-daemon --stacktrace :app:assembleDebug) 2>&1 | tee candidate-evidence/build.log
          cp "$CANDIDATE/app/build/outputs/apk/debug/app-debug.apk" candidate-evidence/Icarus-real-gateway-debug.apk
          sha256sum candidate-evidence/Icarus-real-gateway-debug.apk > candidate-evidence/apk.sha256
      - name: Preserve compiled APK before emulator
        uses: actions/upload-artifact@v7
        with:
          name: Icarus-compiled-gateway-apk
          path: candidate-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        if: false # Runtime gate held until previous failure logs are recovered.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Emulator connection screen verification
        if: false # Compile/artifact recovery only; no runtime claim.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            adb logcat -c
            adb install -r candidate-evidence/Icarus-real-gateway-debug.apk
            adb shell am start -W -n com.icarus.shell/.MainActivity | tee candidate-evidence/launch.log
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml candidate-evidence/window.xml
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png candidate-evidence/screen.png
            adb logcat -d > candidate-evidence/logcat.txt
            python -c 'import xml.etree.ElementTree as E; r=E.parse("candidate-evidence/window.xml"); texts=[n.attrib.get("text","") for n in r.iter()]; required=["ICARUS","Apps Script HTTPS endpoint","One-time pairing code","Voice input unavailable"]; assert all(any(x in t for t in texts) for x in required), texts; assert not any("DEMO:" in t for t in texts); submit=[n for n in r.iter() if n.attrib.get("text")=="Submit"]; assert submit and all(n.attrib.get("enabled")=="false" for n in submit), "Submit must be disabled before pairing"; print("Connection UI, disabled Submit, demo absence verified")'
            ! grep -q 'FATAL EXCEPTION' candidate-evidence/logcat.txt
            printf 'Compile and emulator connection UI verified. No live backend request or phone execution. Independent endpoint verification remains required.\n' > candidate-evidence/BOUNDARY.txt
      - name: Collect partial emulator output
        timeout-minutes: 1
        if: always()
        continue-on-error: true
        run: |
          if command -v adb >/dev/null; then timeout 15s adb logcat -d > candidate-evidence/logcat-final.txt 2>&1; fi
      - name: Upload source build and emulator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Icarus-codex-real-gateway-candidate
          path: candidate-evidence/
          if-no-files-found: error
          retention-days: 30
