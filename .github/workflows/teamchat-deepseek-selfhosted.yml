name: Teamchat DeepSeek Self-Hosted Canary

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: teamchat-deepseek-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  deepseek_canary:
    if: >-
      github.event.sender.type != 'Bot' &&
      github.event.issue.number == 8 &&
      github.event.issue.pull_request != null &&
      contains('OWNER,MEMBER,COLLABORATOR', github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, 'TEAMCHAT_WAKE') ||
       startsWith(github.event.comment.body, '[TEAMCHAT_WAKE]')) &&
      contains(github.event.comment.body, 'TARGET: DEEPSEEK')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout canonical Teamchat
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers accelerate safetensors sentencepiece

      - name: Run genuine DeepSeek-released model
        id: deepseek
        shell: bash
        env:
          WAKE_BODY: ${{ github.event.comment.body }}
          WAKE_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          cat > /tmp/run_deepseek.py <<'PY'
          import os
          import pathlib
          import re
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          model_id = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
          tokenizer = AutoTokenizer.from_pretrained(model_id)
          model = AutoModelForCausalLM.from_pretrained(
              model_id,
              dtype=torch.float32,
              low_cpu_mem_usage=True,
          )
          model.eval()

          wake = os.environ.get("WAKE_BODY", "")
          wake_id = os.environ.get("WAKE_ID", "")

          if "MODE: CAPABILITY_CEILING_TEST" in wake:
              prompt = (
                  "You are the bounded HumanVibe DeepSeek chair running locally from the official "
                  "DeepSeek-R1-Distill-Qwen-1.5B release. Solve the benchmark in the GitHub wake. "
                  "Reason carefully, but your FINAL answer must be only one valid JSON object with "
                  "exactly these keys: arithmetic, box_strategy, code_fix, schedule. "
                  "Do not add markdown or commentary outside the JSON.\n\n"
                  f"WAKE_COMMENT_ID: {wake_id}\n"
                  f"BENCHMARK:\n{wake}"
              )
          else:
              prompt = (
                  "You are a bounded HumanVibe DeepSeek chair canary running locally from an official "
                  "DeepSeek R1-distill release. Do not perform external actions. Read the GitHub wake "
                  "payload and return one concise final sentence confirming you received it. Include "
                  "the wake comment id and target name in that final sentence.\n\n"
                  f"WAKE_COMMENT_ID: {wake_id}\n"
                  f"WAKE_PAYLOAD:\n{wake}"
              )

          rendered = tokenizer.apply_chat_template(
              [{"role": "user", "content": prompt}],
              tokenize=False,
              add_generation_prompt=True,
          )
          inputs = tokenizer(rendered, return_tensors="pt")

          with torch.inference_mode():
              generated = model.generate(
                  **inputs,
                  max_new_tokens=800,
                  do_sample=True,
                  temperature=0.6,
                  top_p=0.95,
                  pad_token_id=tokenizer.eos_token_id,
              )

          new_tokens = generated[0][inputs["input_ids"].shape[1]:]
          raw = tokenizer.decode(new_tokens, skip_special_tokens=True).strip()

          if "</think>" in raw.lower():
              final = re.split(r"</think>", raw, flags=re.I)[-1].strip()
          else:
              final = re.sub(r"<think>[\s\S]*?</think>", "", raw, flags=re.I).strip()
              if not final:
                  final = raw.strip()

          if not final:
              raise SystemExit("DeepSeek model returned no final text")

          pathlib.Path("/tmp/deepseek-output.txt").write_text(final, encoding="utf-8")
          PY
          python /tmp/run_deepseek.py

      - name: Write verified DeepSeek model response to PR 8
        uses: actions/github-script@v8
        env:
          WAKE_ID: ${{ github.event.comment.id }}
          WAKE_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/deepseek-output.txt', 'utf8').trim();
            if (!output) {
              core.setFailed('DeepSeek model returned no final text.');
              return;
            }
            const benchmark = String(process.env.WAKE_BODY || '').includes('MODE: CAPABILITY_CEILING_TEST');
            const body = [
              benchmark ? '[DEEPSEEK] TEAMCHAT_CAPABILITY_BENCHMARK_RESULT' : '[DEEPSEEK] TEAMCHAT_GENUINE_SELFHOSTED_CANARY_OK',
              '',
              'RUNTIME: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B',
              'HOST: GitHub public standard runner · CPU inference · no model API',
              'SOURCE_WAKE_COMMENT: ' + process.env.WAKE_ID,
              'MODEL_FINAL: ' + output.slice(0, 5000),
              '',
              'BOUNDARY: Genuine DeepSeek-released R1-distill runtime. Not the first-party DeepSeek cloud service or full 671B R1.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 8,
              body
            });
